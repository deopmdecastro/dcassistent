<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>DC — Sistema Operativo</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <style>
    :root {
      --bg-main: #0c0814;
      --bg-card: rgba(255, 255, 255, 0.05);
      --bg-card-hover: rgba(255, 255, 255, 0.08);
      --purple-accent: #8b5cf6;
      --purple-glow: rgba(139, 92, 246, 0.4);
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
      --border-color: rgba(255, 255, 255, 0.1);
      --ok: #36d6c0;
      --warn: #f59e0b;
      --err: #ef4444;
      --fs-base: clamp(10px, 2.6vw, 14px);
    }

    * { box-sizing: border-box; margin: 0; padding: 0;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; user-select: none; }

    html, body { height: 100%; }

    body {
      background-color: #050308;
      display: flex; justify-content: center; align-items: center;
      min-height: 100dvh; color: var(--text-main);
      font-size: var(--fs-base); overflow: hidden;
    }

    /* Enclosure que simula o ecrã — mantém a proporção do painel real */
    .screen-container {
      width: min(800px, 100vw);
      aspect-ratio: 800 / 480;
      max-height: 100dvh;
      background: var(--bg-main);
      border-radius: clamp(0px, 2vw, 16px);
      border: 1px solid var(--border-color);
      box-shadow: 0 0 30px rgba(139, 92, 246, 0.15);
      position: relative; overflow: hidden;
    }

    @media (max-width: 420px), (max-height: 320px) {
      .screen-container { aspect-ratio: auto; width: 100vw; height: 100dvh; border-radius: 0; border: none; }
    }

    .screen { display: none; width: 100%; height: 100%; position: absolute; top: 0; left: 0;
              padding: clamp(8px, 3vw, 24px); overflow-y: auto; }
    .screen.active { display: flex; flex-direction: column; }

    /* ---------- Barra de estado (sempre visível no launcher) ---------- */
    .status-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 0 2px 8px; color: var(--text-muted);
      font-size: clamp(9px, 2.2vw, 13px);
    }
    .status-bar .right { display: flex; align-items: center; gap: 10px; }
    .status-bar i { color: var(--purple-accent); }

    /* ---------- Launcher (ecrã principal do sistema) ---------- */
    #screen-launcher { justify-content: flex-start; }
    .launcher-head { text-align: center; margin: 6px 0 14px; }
    .launcher-head h1 { font-size: clamp(15px, 4.5vw, 26px); font-weight: 300; }
    .launcher-head h1 span { font-weight: 700; color: var(--purple-accent); }
    .launcher-head p { color: var(--text-muted); font-size: clamp(8px, 2vw, 12px); }

    .launcher-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(10px, 3vw, 22px);
      align-content: start;
      flex: 1;
      min-height: 0;
    }
    @media (max-width: 420px), (max-height: 320px) {
      .launcher-grid { grid-template-columns: repeat(3, 1fr); }
    }
    .app-item { display: flex; flex-direction: column; align-items: center; gap: 8px;
                cursor: pointer; text-align: center; padding: 6px; border-radius: 16px; }
    .app-item:active { background: var(--bg-card-hover); }
    .app-icon {
      width: clamp(40px, 12vw, 72px); height: clamp(40px, 12vw, 72px);
      border-radius: 18px; background: var(--bg-card);
      border: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(16px, 5vw, 30px);
      box-shadow: 0 4px 14px rgba(0,0,0,0.35);
    }
    .app-item span { font-size: clamp(8px, 2.1vw, 12px); }
    .app-item small { color: var(--text-muted); font-size: clamp(6px, 1.6vw, 9px); }

    /* ---------- Cabeçalho de aplicação ---------- */
    .app-header { display: flex; align-items: center; gap: 12px; margin-bottom: clamp(8px, 2.5vw, 16px); }
    .back-btn {
      background: var(--bg-card); border: 1px solid var(--border-color);
      color: var(--text-main); width: 32px; height: 32px; border-radius: 10px;
      cursor: pointer; font-size: 14px; flex-shrink: 0;
    }
    .back-btn:hover { background: var(--bg-card-hover); }
    .app-header h2 { font-size: clamp(14px, 4vw, 22px); flex: 1; }
    .app-header .app-icon-mini {
      width: 34px; height: 34px; border-radius: 10px; background: var(--bg-card);
      border: 1px solid var(--border-color);
      display: flex; align-items: center; justify-content: center; font-size: 16px;
    }
    .app-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: clamp(8px, 2vw, 14px); }

    /* ---------- Cartões genéricos ---------- */
    .card { background: var(--bg-card); border: 1px solid var(--border-color);
            border-radius: 16px; padding: clamp(10px, 2.5vw, 18px); }
    .card-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .card-title strong { font-size: clamp(9px, 2.4vw, 14px); }
    .card-title small { color: var(--text-muted); font-size: clamp(7px, 1.9vw, 11px); }

    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .row + .row { margin-top: 10px; }
    .row-label { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .row-label strong { font-size: clamp(9px, 2.4vw, 14px); }
    .row-label small { color: var(--text-muted); font-size: clamp(7px, 1.9vw, 11px); }

    .btn {
      background: var(--purple-accent); color: #fff; border: none;
      padding: clamp(5px, 1.4vw, 9px) clamp(10px, 2.5vw, 16px);
      border-radius: 20px; cursor: pointer; font-size: inherit; white-space: nowrap;
    }
    .btn:active { filter: brightness(1.2); }
    .btn.ghost { background: transparent; border: 1px solid var(--border-color); color: var(--text-main); }
    .btn.ok { background: var(--ok); color: #06251f; }
    .btn.err { background: var(--err); }
    .btn.sm { padding: 3px 10px; font-size: clamp(7px, 1.8vw, 11px); }

    .switch { position: relative; width: clamp(32px, 8vw, 42px); height: clamp(18px, 4.6vw, 24px); flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider-toggle { position: absolute; cursor: pointer; inset: 0;
                     background-color: rgba(255,255,255,0.15); transition: .2s; border-radius: 999px; }
    .slider-toggle::before { position: absolute; content: ""; height: 78%; aspect-ratio: 1;
                             left: 11%; bottom: 11%; background-color: white; transition: .2s; border-radius: 50%; }
    input:checked + .slider-toggle { background-color: var(--purple-accent); }
    input:checked + .slider-toggle::before { transform: translateX(90%); }

    select.settings-select, input.settings-text, .range {
      background: var(--bg-main); color: var(--text-main);
      border: 1px solid var(--border-color); border-radius: 8px;
      padding: 4px 8px; font-size: clamp(8px, 2.2vw, 13px); flex-shrink: 0; max-width: 55%;
    }
    input.settings-text { width: 130px; }
    .range { -webkit-appearance: none; appearance: none; height: 6px; background: rgba(255,255,255,0.15);
             border: none; border-radius: 999px; width: 120px; }
    .range::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
                                   background: var(--purple-accent); cursor: pointer; }

    /* ---------- Conversa (DC Assistant) ---------- */
    .chat-log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
    .msg { max-width: 85%; padding: 8px 12px; border-radius: 14px; font-size: clamp(8px, 2.2vw, 13px); }
    .msg.user { align-self: flex-end; background: var(--purple-accent); color: #fff; border-bottom-right-radius: 4px; }
    .msg.bot { align-self: flex-start; background: var(--bg-card); border: 1px solid var(--border-color); border-bottom-left-radius: 4px; }
    .chat-input { display: flex; gap: 8px; }
    .chat-input input {
      flex: 1; background: var(--bg-card); border: 1px solid var(--border-color);
      color: var(--text-main); border-radius: 20px; padding: 8px 14px; font-size: inherit; min-width: 0;
    }
    .quick-cmds { display: flex; flex-wrap: wrap; gap: 6px; }
    .quick-cmds .btn { font-size: clamp(7px, 1.8vw, 11px); padding: 4px 10px; }

    /* ---------- Tabs dentro de aplicação ---------- */
    .app-tabs { display: flex; gap: 6px; margin-bottom: 4px; }
    .app-tabs .tab-btn {
      background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-muted);
      padding: 5px 12px; border-radius: 12px; cursor: pointer; font-size: clamp(8px, 2vw, 12px);
    }
    .app-tabs .tab-btn.active { background: var(--purple-accent); color: #fff; border-color: var(--purple-accent); }

    /* ---------- Monitorização ---------- */
    .sensor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(8px, 2vw, 14px); }
    .sensor { text-align: center; padding: 12px 8px; }
    .sensor .val { font-size: clamp(16px, 5vw, 30px); font-weight: 700; }
    .sensor .lbl { color: var(--text-muted); font-size: clamp(7px, 1.9vw, 11px); }
    .bar-chart { display: flex; align-items: flex-end; gap: 6px; height: 70px; margin-top: 8px; }
    .bar-chart .bar { flex: 1; background: var(--purple-accent); border-radius: 4px 4px 0 0; opacity: .85; }

    /* ---------- Alarmes ---------- */
    .alarm-item { display: flex; align-items: center; gap: 10px; padding: 10px; }
    .alarm-item .prio { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .prio.alta { background: var(--err); } .prio.media { background: var(--warn); } .prio.baixa { background: var(--ok); }

    /* ---------- Loja ---------- */
    .store-cats { display: flex; flex-wrap: wrap; gap: 6px; }
    .store-cats .cat-chip { background: var(--bg-card); border: 1px solid var(--border-color);
                            padding: 4px 10px; border-radius: 12px; cursor: pointer;
                            font-size: clamp(7px, 1.8vw, 11px); color: var(--text-muted); }
    .store-cats .cat-chip.active { background: var(--purple-accent); color: #fff; border-color: var(--purple-accent); }
    .store-item { display: flex; align-items: center; gap: 10px; }
    .store-item .app-icon { width: 40px; height: 40px; border-radius: 12px; font-size: 16px; flex-shrink: 0; }
    .store-meta { color: var(--text-muted); font-size: clamp(7px, 1.8vw, 10px); }

    /* ---------- Definições ---------- */
    .settings-cats { display: flex; flex-wrap: wrap; gap: 6px; }
    .settings-cats .cat-chip { background: var(--bg-card); border: 1px solid var(--border-color);
                              padding: 4px 10px; border-radius: 12px; cursor: pointer;
                              font-size: clamp(7px, 1.8vw, 11px); color: var(--text-muted); }
    .settings-cats .cat-chip.active { background: var(--purple-accent); color: #fff; border-color: var(--purple-accent); }

    .hidden { display: none !important; }
    .muted { color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="screen-container">

    <!-- ============ LAUNCHER (ecrã principal do sistema) ============ -->
    <div class="screen active" id="screen-launcher">
      <div class="status-bar">
        <span id="sb-clock">--:--</span>
        <div class="right">
          <i class="fa-solid fa-wifi" id="sb-wifi"></i>
          <i class="fa-solid fa-volume-high"></i>
          <i class="fa-solid fa-battery-three-quarters"></i>
        </div>
      </div>
      <div class="launcher-head">
        <h1 data-i18n="os.title">DC <span>Sistema</span></h1>
        <p data-i18n="os.subtitle">Escolhe uma aplicação</p>
      </div>
      <div class="launcher-grid" id="launcher-grid"></div>
    </div>

    <!-- ============ AMBIENTE DE APLICAÇÃO (render dinâmico) ============ -->
    <div class="screen" id="screen-app">
      <div class="app-header">
        <button class="back-btn" onclick="goHome()"><i class="fa-solid fa-chevron-left"></i></button>
        <div class="app-icon-mini" id="app-header-icon"></div>
        <h2 id="app-header-title"></h2>
      </div>
      <div class="app-body" id="app-body"></div>
    </div>

  </div>

  <script>
    /* ================================================================
       REGISTO DE APLICAÇÕES (App Registry) — fonte de verdade do sistema.
       A Loja e as Definições → Aplicações leem este mesmo registo.
    ================================================================ */
    const APPS = [
      { id: 'assistant',     name: 'DC Assistant',  icon: 'fa-solid fa-robot',        color: '#8b5cf6', desc: 'Assistente inteligente do sistema' },
      { id: 'controlo',      name: 'Controlo',       icon: 'fa-solid fa-sliders',      color: '#36d6c0', desc: 'Comandos do sistema' },
      { id: 'monitorizacao', name: 'Monitorização', icon: 'fa-solid fa-chart-line',    color: '#4cc9f0', desc: 'Tempo real e histórico' },
      { id: 'alarmes',       name: 'Alarmes',        icon: 'fa-solid fa-bell',         color: '#ef4444', desc: 'Central de alarmes e eventos' },
      { id: 'agenda',        name: 'Agenda',         icon: 'fa-regular fa-calendar-days', color: '#f59e0b', desc: 'Tarefas e eventos' },
      { id: 'musica',        name: 'Música',         icon: 'fa-brands fa-spotify',    color: '#1DB954', desc: 'Entretenimento e multimédia' },
      { id: 'loja',          name: 'Loja',           icon: 'fa-solid fa-store',        color: '#f72585', desc: 'App Store do sistema' },
      { id: 'definicoes',    name: 'Definições',     icon: 'fa-solid fa-gear',         color: '#8e9aaf', desc: 'Definições globais do sistema' },
    ];
    const appById = id => APPS.find(a => a.id === id);

    /* ================================================================
       ESTADO — definições separadas por âmbito:
       · system.*  → definições GLOBAIS do sistema
       · assistant.* → definições da APLICAÇÃO DC Assistant
    ================================================================ */
    const SYS_KEY = 'dc_system_settings';
    const ASST_KEY = 'dc_assistant_settings';

    const defaultSystem = {
      deviceName: 'DC', language: 'pt', theme: 'dark', brightness: 80, volume: 60,
      wifiOn: false, bluetoothOn: false, lockOn: false, showStats: true,
    };
    const defaultAssistant = {
      name: 'DC', language: 'pt', voice: 'feminina', personality: 'amigável',
      notifications: 'alto', allowCommands: true, integrations: ['spotify', 'agenda'],
      model: 'mock', privacy: true,
    };

    const system = { ...defaultSystem, ...(JSON.parse(localStorage.getItem(SYS_KEY) || '{}')) };
    const assistant = { ...defaultAssistant, ...(JSON.parse(localStorage.getItem(ASST_KEY) || '{}')) };

    function saveSystem()  { localStorage.setItem(SYS_KEY, JSON.stringify(system)); }
    function saveAssistant(){ localStorage.setItem(ASST_KEY, JSON.stringify(assistant)); }

    /* ================================================================
       i18n (nomes de aplicações e rótulos principais)
    ================================================================ */
    const translations = {
      pt: {
        'os.title': 'DC <span>Sistema</span>',
        'os.subtitle': 'Escolhe uma aplicação',
        'back': 'Voltar',
        'app.assistant': 'DC Assistant', 'app.controlo': 'Controlo',
        'app.monitorizacao': 'Monitorização', 'app.alarmes': 'Alarmes',
        'app.agenda': 'Agenda', 'app.musica': 'Música',
        'app.loja': 'Loja', 'app.definicoes': 'Definições',
      },
      en: {
        'os.title': 'DC <span>System</span>',
        'os.subtitle': 'Pick an app',
        'back': 'Back',
        'app.assistant': 'DC Assistant', 'app.controlo': 'Control',
        'app.monitorizacao': 'Monitoring', 'app.alarmes': 'Alarms',
        'app.agenda': 'Calendar', 'app.musica': 'Music',
        'app.loja': 'Store', 'app.definicoes': 'Settings',
      },
    };
    function t(key) {
      const dict = translations[system.language] || translations.pt;
      return dict[key] || key;
    }
    function applyI18n() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n');
        if (k === 'os.title') el.innerHTML = t(k); else el.textContent = t(k);
      });
      renderLauncher();
    }

    /* ================================================================
       NAVEGAÇÃO — Sistema Operativo → Aplicações → Funções
       (sem números de tela; só openApp() / goHome())
    ================================================================ */
    let currentApp = null;

    function openApp(id) {
      currentApp = id;
      const app = appById(id);
      document.getElementById('screen-launcher').classList.remove('active');
      document.getElementById('screen-app').classList.add('active');
      document.getElementById('app-header-title').textContent = app.name;
      document.getElementById('app-header-icon').innerHTML = `<i class="${app.icon}" style="color:${app.color}"></i>`;
      renderApp(id);
    }

    function goHome() {
      currentApp = null;
      document.getElementById('screen-app').classList.remove('active');
      document.getElementById('screen-launcher').classList.add('active');
    }

    /* ================================================================
       LAUNCHER
    ================================================================ */
    function renderLauncher() {
      const grid = document.getElementById('launcher-grid');
      grid.innerHTML = '';
      APPS.forEach(app => {
        const item = document.createElement('div');
        item.className = 'app-item';
        item.innerHTML = `
          <div class="app-icon" style="color:${app.color}"><i class="${app.icon}"></i></div>
          <span>${t('app.' + app.id)}</span>
          <small>${app.desc}</small>`;
        item.onclick = () => openApp(app.id);
        grid.appendChild(item);
      });
    }

    /* ================================================================
       RENDERIZAÇÃO DE CADA APLICAÇÃO
    ================================================================ */
    function renderApp(id) {
      const body = document.getElementById('app-body');
      const renderers = {
        assistant: renderAssistant, controlo: renderControlo, monitorizacao: renderMonitorizacao,
        alarmes: renderAlarmes, agenda: renderAgenda, musica: renderMusica,
        loja: renderLoja, definicoes: renderDefinicoes,
      };
      body.innerHTML = '';
      (renderers[id] || (() => { body.innerHTML = '<div class="card muted">Em breve.</div>'; }))();
    }

    /* ---------------- DC Assistant ---------------- */
    const chatHistory = [];
    function renderAssistant() {
      const body = document.getElementById('app-body');
      body.innerHTML = `
        <div class="app-tabs">
          <button class="tab-btn active" data-tab="conversa">Conversa</button>
          <button class="tab-btn" data-tab="estado">Estado</button>
          <button class="tab-btn" data-tab="defs">Definições</button>
        </div>
        <div id="asst-panel"></div>`;
      body.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => {
        body.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        renderAssistantTab(b.dataset.tab);
      });
      renderAssistantTab('conversa');
    }

    function renderAssistantTab(tab) {
      const panel = document.getElementById('asst-panel');
      if (tab === 'conversa') {
        panel.innerHTML = `
          <div class="card" style="flex:1; display:flex; flex-direction:column; min-height:0;">
            <div class="chat-log" id="chat-log">
              <div class="msg bot">Olá! Sou a <b>${assistant.name}</b>. Em que posso ajudar?</div>
            </div>
            <div class="quick-cmds" style="margin:8px 0;">
              <button class="btn sm" onclick="assistantQuick('estado do sistema')">Estado do sistema</button>
              <button class="btn sm" onclick="assistantQuick('análise de alarmes')">Análise de alarmes</button>
              <button class="btn sm" onclick="assistantQuick('resumo de eventos')">Resumo de eventos</button>
              <button class="btn sm" onclick="assistantQuick('sugestões')">Sugestões</button>
            </div>
            <div class="chat-input">
              <input id="chat-text" placeholder="Escreve um comando..." onkeydown="if(event.key==='Enter')assistantSend()">
              <button class="btn" onclick="assistantSend()"><i class="fa-solid fa-paper-plane"></i></button>
            </div>
          </div>`;
      } else if (tab === 'estado') {
        panel.innerHTML = `
          <div class="card"><div class="card-title"><strong>Estado do sistema</strong><small>DC Assistant</small></div>
            <div class="row"><span class="muted">Dispositivo</span><b>${system.deviceName}</b></div>
            <div class="row"><span class="muted">Rede</span><b style="color:${system.wifiOn ? 'var(--ok)' : 'var(--err)'}">${system.wifiOn ? 'Ligada' : 'Desligada'}</b></div>
            <div class="row"><span class="muted">Temperatura</span><b>23.4 °C</b></div>
            <div class="row"><span class="muted">Humidade</span><b>61%</b></div>
            <div class="row"><span class="muted">Alarmes ativos</span><b style="color:var(--err)">1</b></div>
          </div>
          <div class="card"><div class="card-title"><strong>Análise de alarmes</strong><small>sugestão automática</small></div>
            <p class="muted">Temperatura do controlo elevada (28.1 °C). Sugestão: verificar ventilação ou reduzir setpoint.</p>
          </div>`;
      } else {
        // Definições da APLICAÇÃO DC Assistant (namespace assistant.*)
        panel.innerHTML = `
          <div class="card"><div class="card-title"><strong>Definições do DC Assistant</strong><small>só esta aplicação</small></div>
            <div class="row"><div class="row-label"><strong>Nome do assistente</strong></div>
              <input class="settings-text" id="asst-name" value="${assistant.name}" onchange="assistant.name=this.value;saveAssistant()"></div>
            <div class="row"><div class="row-label"><strong>Idioma</strong></div>
              <select class="settings-select" onchange="assistant.language=this.value;saveAssistant()">
                <option value="pt" ${assistant.language==='pt'?'selected':''}>Português</option>
                <option value="en" ${assistant.language==='en'?'selected':''}>English</option></select></div>
            <div class="row"><div class="row-label"><strong>Voz</strong></div>
              <select class="settings-select" onchange="assistant.voice=this.value;saveAssistant()">
                <option value="feminina" ${assistant.voice==='feminina'?'selected':''}>Feminina</option>
                <option value="masculina" ${assistant.voice==='masculina'?'selected':''}>Masculina</option></select></div>
            <div class="row"><div class="row-label"><strong>Personalidade</strong></div>
              <select class="settings-select" onchange="assistant.personality=this.value;saveAssistant()">
                <option value="amigável" ${assistant.personality==='amigável'?'selected':''}>Amigável</option>
                <option value="formal" ${assistant.personality==='formal'?'selected':''}>Formal</option>
                <option value="discreta" ${assistant.personality==='discreta'?'selected':''}>Discreta</option></select></div>
            <div class="row"><div class="row-label"><strong>Nível de notificações</strong></div>
              <select class="settings-select" onchange="assistant.notifications=this.value;saveAssistant()">
                <option value="alto" ${assistant.notifications==='alto'?'selected':''}>Alto</option>
                <option value="médio" ${assistant.notifications==='médio'?'selected':''}>Médio</option>
                <option value="silencioso" ${assistant.notifications==='silencioso'?'selected':''}>Silencioso</option></select></div>
            <div class="row"><div class="row-label"><strong>Permitir executar comandos</strong></div>
              <label class="switch"><input type="checkbox" ${assistant.allowCommands?'checked':''} onchange="assistant.allowCommands=this.checked;saveAssistant()"><span class="slider-toggle"></span></label></div>
            <div class="row"><div class="row-label"><strong>Modelo de IA</strong></div>
              <select class="settings-select" onchange="assistant.model=this.value;saveAssistant()">
                <option value="mock" ${assistant.model==='mock'?'selected':''}>Mock (local)</option>
                <option value="anthropic" ${assistant.model==='anthropic'?'selected':''}>Anthropic</option></select></div>
            <div class="row"><div class="row-label"><strong>Privacidade e histórico</strong></div>
              <label class="switch"><input type="checkbox" ${assistant.privacy?'checked':''} onchange="assistant.privacy=this.checked;saveAssistant()"><span class="slider-toggle"></span></label></div>
          </div>`;
      }
    }

    function assistantQuick(cmd) {
      document.getElementById('chat-text').value = cmd;
      assistantSend();
    }
    function assistantSend() {
      const input = document.getElementById('chat-text');
      const text = input.value.trim();
      if (!text) return;
      const log = document.getElementById('chat-log');
      log.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = '';
      chatHistory.unshift(text);
      setTimeout(() => {
        const replies = {
          'estado do sistema': 'Tudo operacional. Rede ligada, temperatura 23.4 °C, 1 alarme ativo.',
          'análise de alarmes': '1 alarme ativo (prioridade alta): temperatura elevada no controlo.',
          'resumo de eventos': 'Hoje: 2 eventos na agenda, 0 manutenções agendadas.',
          'sugestões': 'Sugiro baixar o setpoint do controlo em 1 °C e verificar a ventilação.',
        };
        const reply = replies[text.toLowerCase()] || `Recebido: "${text}". (Resposta simulada — liga ao Gateway na fase 0.5.)`;
        log.innerHTML += `<div class="msg bot">${reply}</div>`;
        log.scrollTop = log.scrollHeight;
      }, 300);
      log.scrollTop = log.scrollHeight;
    }

    /* ---------------- Controlo ---------------- */
    function renderControlo() {
      const body = document.getElementById('app-body');
      body.innerHTML = `
        <div class="card"><div class="card-title"><strong>Estado</strong><small>Controlo</small></div>
          <div class="row"><span class="muted">Equipamento</span><b style="color:var(--ok)">Ligado</b></div>
          <div class="row"><span class="muted">Modo</span><b>Automático</b></div>
        </div>
        <div class="card"><div class="card-title"><strong>Comandos</strong></div>
          <div class="row">
            <button class="btn ok" onclick="this.style.filter='brightness(1.2)'">Ligar</button>
            <button class="btn err" onclick="this.style.filter='brightness(1.2)'">Desligar</button>
            <button class="btn ghost" onclick="this.style.filter='brightness(1.2)'">Manual</button>
            <button class="btn ghost" onclick="this.style.filter='brightness(1.2)'">Automático</button>
          </div>
        </div>
        <div class="card"><div class="card-title"><strong>Setpoints</strong><small>configuração da aplicação</small></div>
          <div class="row"><div class="row-label"><strong>Temperatura</strong><small>${'21.0'} °C</small></div>
            <input type="range" class="range" min="10" max="35" value="21" oninput="this.previousElementSibling.querySelector('small').textContent=this.value+'.0 °C'"></div>
          <div class="row"><div class="row-label"><strong>Humidade</strong><small>${'55'}%</small></div>
            <input type="range" class="range" min="20" max="90" value="55" oninput="this.previousElementSibling.querySelector('small').textContent=this.value+'%'"></div>
          <div class="row"><div class="row-label"><strong>Modos de funcionamento</strong></div>
            <select class="settings-select"><option>Automático</option><option>Manual</option><option>Eco</option><option>Conforto</option></select></div>
        </div>`;
    }

    /* ---------------- Monitorização ---------------- */
    function renderMonitorizacao() {
      const body = document.getElementById('app-body');
      body.innerHTML = `
        <div class="sensor-grid">
          <div class="card sensor"><div class="val" style="color:var(--warn)">23.4°</div><div class="lbl">Temperatura</div></div>
          <div class="card sensor"><div class="val" style="color:var(--ok)">61%</div><div class="lbl">Humidade</div></div>
          <div class="card sensor"><div class="val" style="color:var(--purple-accent)">12.8V</div><div class="lbl">Tensão</div></div>
          <div class="card sensor"><div class="val" style="color:var(--ok)">OK</div><div class="lbl">Equipamentos</div></div>
        </div>
        <div class="card"><div class="card-title"><strong>Temperatura (últimas horas)</strong><small>gráfico</small></div>
          <div class="bar-chart">
            ${[40,55,48,62,70,58,66,74,60,52,58,64].map(h => `<div class="bar" style="height:${h}%"></div>`).join('')}
          </div>
        </div>
        <div class="card"><div class="card-title"><strong>Histórico</strong><small>sensores</small></div>
          <div class="row"><span class="muted">14:32</span><span>Temperatura 23.4 °C</span></div>
          <div class="row"><span class="muted">14:30</span><span>Humidade 61%</span></div>
          <div class="row"><span class="muted">14:28</span><span>Equipamento 1 ligado</span></div>
        </div>`;
    }

    /* ---------------- Alarmes ---------------- */
    const alarmes = [
      { prio: 'alta', titulo: 'Temperatura elevada no controlo', hora: '14:31', ativo: true },
      { prio: 'media', titulo: 'Humidade fora do intervalo', hora: '13:05', ativo: false },
      { prio: 'baixa', titulo: 'Manutenção programada', hora: '09:00', ativo: false },
    ];
    function renderAlarmes() {
      const body = document.getElementById('app-body');
      body.innerHTML = `
        <div class="app-tabs">
          <button class="tab-btn active" data-tab="ativos">Ativos</button>
          <button class="tab-btn" data-tab="historico">Histórico</button>
        </div>
        <div id="alarm-panel"></div>`;
      body.querySelectorAll('.tab-btn').forEach(b => b.onclick = () => {
        body.querySelectorAll('.tab-btn').forEach(x => x.classList.remove('active'));
        b.classList.add('active');
        renderAlarmTab(b.dataset.tab);
      });
      renderAlarmTab('ativos');
    }
    function renderAlarmTab(tab) {
      const panel = document.getElementById('alarm-panel');
      const list = tab === 'ativos' ? alarmes.filter(a => a.ativo) : alarmes;
      panel.innerHTML = `<div class="card">
        ${list.length ? list.map(a => `
          <div class="row alarm-item" style="margin:0;">
            <span class="prio ${a.prio}"></span>
            <div class="row-label"><strong>${a.titulo}</strong><small>${a.hora} · prioridade ${a.prio}</small></div>
            ${a.ativo ? `<div style="display:flex;gap:6px">
              <button class="btn sm ok" onclick="reconhecerAlarme(this)">Reconhecer</button>
              <button class="btn sm ghost" onclick="silenciarAlarme(this)">Silenciar</button></div>`
              : `<span class="muted">reconhecido</span>`}
          </div>`).join('')
        : '<p class="muted">Sem alarmes ativos.</p>'}
      </div>`;
    }
    function reconhecerAlarme(btn) { btn.closest('.row').querySelector('.muted').textContent = 'reconhecido'; btn.closest('div').remove(); }
    function silenciarAlarme(btn) { btn.textContent = 'Silenciado'; }

    /* ---------------- Agenda ---------------- */
    function renderAgenda() {
      const body = document.getElementById('app-body');
      body.innerHTML = `
        <div class="card"><div class="card-title"><strong>Hoje</strong><small>${new Date().toLocaleDateString('pt-PT',{weekday:'long', day:'numeric', month:'long'})}</small></div>
          <div class="row"><span class="muted">09:00</span><span>Reunião de equipa</span></div>
          <div class="row"><span class="muted">11:30</span><span>Verificação de rotina</span></div>
          <div class="row"><span class="muted">15:00</span><span>Manutenção preventiva</span></div>
        </div>
        <div class="card"><div class="card-title"><strong>Próximos</strong></div>
          <div class="row"><span class="muted">Amanhã</span><span>Inspeção de sensores</span></div>
          <div class="row"><span class="muted">Sábado</span><span>Backup do sistema</span></div>
        </div>
        <div class="card"><div class="card-title"><strong>Novo evento</strong></div>
          <div class="row"><input class="settings-text" style="flex:1;max-width:none" placeholder="Título do evento...">
            <button class="btn sm" onclick="this.textContent='Adicionado ✓'">Adicionar</button></div>
        </div>`;
    }

    /* ---------------- Música ---------------- */
    let playing = false;
    function renderMusica() {
      const body = document.getElementById('app-body');
      body.innerHTML = `
        <div class="card" style="text-align:center;">
          <div class="app-icon" style="width:90px;height:90px;margin:0 auto 10px;border-radius:20px;color:#1DB954;font-size:34px;"><i class="fa-brands fa-spotify"></i></div>
          <h3>Blinding Lights</h3>
          <p class="muted">The Weeknd</p>
          <div class="row" style="justify-content:center;gap:24px;margin-top:12px;">
            <i class="fa-solid fa-backward-step" style="cursor:pointer"></i>
            <i class="fa-solid fa-circle-play" id="play-btn" style="cursor:pointer;font-size:26px;color:var(--purple-accent)" onclick="togglePlay()"></i>
            <i class="fa-solid fa-forward-step" style="cursor:pointer"></i>
          </div>
        </div>
        <div class="card"><div class="card-title"><strong>Volume</strong></div>
          <div class="row"><input type="range" class="range" min="0" max="100" value="${system.volume}" style="flex:1" oninput="system.volume=this.value;saveSystem()"></div>
        </div>
        <div class="card"><div class="card-title"><strong>Definições da aplicação</strong><small>só Música</small></div>
          <div class="row"><div class="row-label"><strong>Qualidade de streaming</strong></div>
            <select class="settings-select"><option>Alta</option><option>Normal</option><option>Baixa</option></select></div>
        </div>`;
    }
    function togglePlay() {
      playing = !playing;
      const b = document.getElementById('play-btn');
      b.className = playing ? 'fa-solid fa-circle-pause' : 'fa-solid fa-circle-play';
    }

    /* ---------------- Loja ---------------- */
    const STORE_CATALOG = [
      { id: 'clima',   name: 'Clima',      icon: 'fa-solid fa-cloud-sun',     color: '#4cc9f0', cat: 'Utilitários',   desc: 'Meteorologia local', version: '1.0', size: '2.4 MB' },
      { id: 'notas',   name: 'Notas',      icon: 'fa-regular fa-note-sticky', color: '#f72585', cat: 'Produtividade', desc: 'Notas rápidas',      version: '1.2', size: '1.1 MB' },
      { id: 'chamadas', name: 'Chamadas',  icon: 'fa-solid fa-phone',         color: '#36d6c0', cat: 'Comunicação',   desc: 'Contactos e chamadas', version: '0.9', size: '3.0 MB' },
      { id: 'ficheiros', name: 'Ficheiros', icon: 'fa-regular fa-folder-open', color: '#f59e0b', cat: 'Utilitários',  desc: 'Gestão de ficheiros', version: '1.0', size: '2.0 MB' },
      { id: 'email',  name: 'E-mail',      icon: 'fa-regular fa-envelope',    color: '#ea4335', cat: 'Produtividade', desc: 'Correio eletrónico',  version: '1.1', size: '4.2 MB' },
      { id: 'seguranca', name: 'Segurança', icon: 'fa-solid fa-shield-halved', color: '#ef4444', cat: 'Segurança',     desc: 'Câmaras e sensores',  version: '0.5', size: '5.6 MB' },
      { id: 'rega',   name: 'Rega',        icon: 'fa-solid fa-droplet',       color: '#4cc9f0', cat: 'Automação',     desc: 'Controlo de rega',    version: '0.8', size: '1.8 MB' },
      { id: 'relatorios', name: 'Relatórios', icon: 'fa-solid fa-chart-simple', color: '#8b5cf6', cat: 'Monitorização', desc: 'Relatórios do sistema', version: '1.0', size: '2.7 MB' },
    ];
    const STORE_KEY = 'dc_store_installed';
    const storeInstalled = new Set(JSON.parse(localStorage.getItem(STORE_KEY) || '[]'));
    function saveStore() { localStorage.setItem(STORE_KEY, JSON.stringify([...storeInstalled])); }
    let storeCat = 'Todas';

    function renderLoja() {
      const body = document.getElementById('app-body');
      const cats = ['Todas', ...new Set(STORE_CATALOG.map(c => c.cat))];
      body.innerHTML = `
        <div class="store-cats">${cats.map(c => `<span class="cat-chip ${c===storeCat?'active':''}" onclick="storeCat='${c}';renderLoja()">${c}</span>`).join('')}</div>
        <div id="store-list"></div>`;
      const list = document.getElementById('store-list');
      const filtered = STORE_CATALOG.filter(c => storeCat === 'Todas' || c.cat === storeCat);
      filtered.forEach(app => {
        const installed = storeInstalled.has(app.id);
        const card = document.createElement('div');
        card.className = 'card store-item';
        card.innerHTML = `
          <div class="app-icon" style="color:${app.color}"><i class="${app.icon}"></i></div>
          <div class="row-label" style="flex:1">
            <strong>${app.name}</strong>
            <small class="store-meta">${app.cat} · v${app.version} · ${app.size}</small>
            <small class="muted">${app.desc}</small>
          </div>
          <button class="btn sm ${installed ? 'ghost' : ''}" onclick="toggleStoreApp('${app.id}', this)">${installed ? 'Remover' : 'Instalar'}</button>`;
        list.appendChild(card);
      });
    }
    function toggleStoreApp(id, btn) {
      if (storeInstalled.has(id)) { storeInstalled.delete(id); btn.textContent = 'Instalar'; btn.classList.add('ghost'); }
      else { storeInstalled.add(id); btn.textContent = 'Remover'; btn.classList.remove('ghost'); }
      saveStore();
    }

    /* ---------------- Definições (globais do sistema) ---------------- */
    const SET_CATS = ['Sistema', 'Interface', 'Rede', 'Segurança', 'Hardware', 'Aplicações'];
    let setCat = 'Sistema';
    function renderDefinicoes() {
      const body = document.getElementById('app-body');
      body.innerHTML = `
        <div class="settings-cats">${SET_CATS.map(c => `<span class="cat-chip ${c===setCat?'active':''}" onclick="setCat='${c}';renderDefinicoes()">${c}</span>`).join('')}</div>
        <div id="set-panel"></div>`;
      renderSetCat();
    }
    function renderSetCat() {
      const panel = document.getElementById('set-panel');
      const rows = {
        'Sistema': `
          <div class="row"><div class="row-label"><strong>Nome do dispositivo</strong></div>
            <input class="settings-text" value="${system.deviceName}" onchange="system.deviceName=this.value;saveSystem()"></div>
          <div class="row"><div class="row-label"><strong>Data e hora</strong></div><span class="muted">Automático (NTP)</span></div>
          <div class="row"><div class="row-label"><strong>Idioma</strong></div>
            <select class="settings-select" onchange="system.language=this.value;saveSystem();applyI18n()">
              <option value="pt" ${system.language==='pt'?'selected':''}>Português</option>
              <option value="en" ${system.language==='en'?'selected':''}>English</option></select></div>
          <div class="row"><div class="row-label"><strong>Região</strong></div><span class="muted">PT</span></div>
          <div class="row"><button class="btn ghost sm">Reiniciar sistema</button><button class="btn err sm">Desligar sistema</button></div>
          <div class="row"><span class="muted">Informações do dispositivo</span><span>ESP32-S3 · DC 0.3</span></div>`,
        'Interface': `
          <div class="row"><div class="row-label"><strong>Tema</strong></div>
            <select class="settings-select" onchange="system.theme=this.value;saveSystem()">
              <option value="dark" ${system.theme==='dark'?'selected':''}>Escuro</option>
              <option value="light" ${system.theme==='light'?'selected':''}>Claro</option></select></div>
          <div class="row"><div class="row-label"><strong>Brilho</strong></div>
            <input type="range" class="range" min="20" max="100" value="${system.brightness}" oninput="system.brightness=this.value;saveSystem();document.body.style.filter='brightness('+this.value+'%)'"></div>
          <div class="row"><div class="row-label"><strong>Volume</strong></div>
            <input type="range" class="range" min="0" max="100" value="${system.volume}" oninput="system.volume=this.value;saveSystem()"></div>
          <div class="row"><div class="row-label"><strong>Papel de parede</strong></div><button class="btn ghost sm">Escolher</button></div>
          <div class="row"><div class="row-label"><strong>Tamanho dos textos</strong></div>
            <select class="settings-select"><option>Normal</option><option>Grande</option></select></div>
          <div class="row"><div class="row-label"><strong>Mostrar CPU / FPS</strong></div>
            <label class="switch"><input type="checkbox" ${system.showStats?'checked':''} onchange="system.showStats=this.checked;saveSystem()"><span class="slider-toggle"></span></label></div>`,
        'Rede': `
          <div class="row"><div class="row-label"><strong>Wi-Fi</strong></div>
            <label class="switch"><input type="checkbox" ${system.wifiOn?'checked':''} onchange="system.wifiOn=this.checked;saveSystem();document.getElementById('sb-wifi').style.color=this.checked?'var(--ok)':'var(--purple-accent)'"><span class="slider-toggle"></span></label></div>
          <div class="row"><div class="row-label"><strong>Bluetooth</strong></div>
            <label class="switch"><input type="checkbox" ${system.bluetoothOn?'checked':''} onchange="system.bluetoothOn=this.checked;saveSystem()"><span class="slider-toggle"></span></label></div>
          <div class="row"><div class="row-label"><strong>Ethernet</strong></div><span class="muted">Não ligado</span></div>
          <div class="row"><div class="row-label"><strong>Estado da ligação</strong></div><b style="color:${system.wifiOn?'var(--ok)':'var(--err)'}">${system.wifiOn?'Ligada':'Desligada'}</b></div>
          <div class="row"><div class="row-label"><strong>Configuração IP</strong></div><span class="muted">DHCP</span></div>`,
        'Segurança': `
          <div class="row"><div class="row-label"><strong>Bloqueio do sistema</strong></div>
            <label class="switch"><input type="checkbox" ${system.lockOn?'checked':''} onchange="system.lockOn=this.checked;saveSystem()"><span class="slider-toggle"></span></label></div>
          <div class="row"><div class="row-label"><strong>PIN / palavra-passe</strong></div><button class="btn ghost sm">Definir</button></div>
          <div class="row"><div class="row-label"><strong>Utilizadores</strong></div><span class="muted">1</span></div>
          <div class="row"><div class="row-label"><strong>Sessões ativas</strong></div><span class="muted">1</span></div>`,
        'Hardware': `
          <div class="row"><div class="row-label"><strong>Estado do ESP32</strong></div><b style="color:var(--ok)">OK</b></div>
          <div class="row"><div class="row-label"><strong>Sensores</strong></div><span class="muted">2 ativos</span></div>
          <div class="row"><div class="row-label"><strong>Entradas e saídas</strong></div><span class="muted">4 livres</span></div>
          <div class="row"><div class="row-label"><strong>Relés</strong></div><span class="muted">0 ativos</span></div>
          <div class="row"><div class="row-label"><strong>Dispositivos conectados</strong></div><span class="muted">1</span></div>
          <div class="row"><button class="btn ghost sm">Diagnóstico</button></div>`,
        'Aplicações': `
          <div class="row"><div class="row-label"><strong>Aplicações instaladas</strong></div><b>${APPS.length + storeInstalled.size}</b></div>
          <div class="row"><div class="row-label"><strong>Permissões das aplicações</strong></div><button class="btn ghost sm">Gerir</button></div>
          <div class="row"><div class="row-label"><strong>Notificações</strong></div><button class="btn ghost sm">Gerir</button></div>
          <div class="row"><div class="row-label"><strong>Armazenamento</strong></div><span class="muted">1.2 GB livres</span></div>
          <div class="row"><div class="row-label"><strong>Atualizações</strong></div><button class="btn ghost sm">Verificar</button></div>`,
      };
      panel.innerHTML = `<div class="card">${rows[setCat] || ''}</div>`;
    }

    /* ================================================================
       RELÓGIO (placeholder até NTP/RTC)
    ================================================================ */
    function clockLoop() {
      const el = document.getElementById('sb-clock');
      const d = new Date();
      el.textContent = `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`;
      setTimeout(clockLoop, 1000);
    }

    /* ================================================================
       INIT
    ================================================================ */
    renderLauncher();
    applyI18n();
    document.getElementById('sb-wifi').style.color = system.wifiOn ? 'var(--ok)' : 'var(--purple-accent)';
    document.body.style.filter = `brightness(${system.brightness}%)`;
    clockLoop();
  </script>
</body>
</html>
