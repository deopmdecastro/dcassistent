<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>DC — Sistema Operativo</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ==============================================================
       DC OS — Tema Escuro Moderno (Glassmorphism + Aurora)
    ============================================================== */
    :root {
      --bg-void: #05030c;
      --bg-deep: #0a0716;
      --bg-elev: rgba(255, 255, 255, 0.045);
      --bg-elev-2: rgba(255, 255, 255, 0.075);
      --bg-elev-hover: rgba(255, 255, 255, 0.11);
      --stroke: rgba(255, 255, 255, 0.08);
      --stroke-strong: rgba(255, 255, 255, 0.16);

      --accent: #a78bfa;
      --accent-2: #7c3aed;
      --accent-cyan: #22d3ee;
      --accent-pink: #f472b6;
      --glow: rgba(139, 92, 246, 0.55);

      --text: #f5f3ff;
      --text-dim: #b4b0c8;
      --text-mute: #7a758f;

      --ok: #34d399;
      --warn: #fbbf24;
      --err: #f87171;

      --r-sm: 10px;
      --r-md: 14px;
      --r-lg: 20px;
      --r-xl: 28px;

      --shadow-1: 0 10px 30px rgba(0,0,0,0.45);
      --shadow-glow: 0 0 40px rgba(139, 92, 246, 0.25);

      --fs-base: clamp(11px, 2.6vw, 14px);
      --dur: 240ms;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0;
        font-family: 'Sora', 'Segoe UI', system-ui, sans-serif;
        -webkit-tap-highlight-color: transparent; user-select: none; }
    ::selection { background: var(--accent-2); color: #fff; }

    html, body { height: 100%; }

    body {
      background: #020106;
      display: flex; justify-content: center; align-items: center;
      min-height: 100dvh; color: var(--text);
      font-size: var(--fs-base); overflow: hidden;
    }

    /* ---------- Enclosure que simula o ecrã do dispositivo ---------- */
    .device {
      width: min(800px, 100vw);
      aspect-ratio: 800 / 480;
      max-height: 100dvh;
      background: var(--bg-void);
      border-radius: clamp(0px, 2vw, 20px);
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow-1), var(--shadow-glow);
      position: relative; overflow: hidden; isolation: isolate;
    }

    /* Aurora background (aurora glows atrás de tudo) */
    .device::before, .device::after {
      content: ""; position: absolute; inset: -30%; z-index: 0;
      background:
        radial-gradient(closest-side at 20% 20%, rgba(124, 58, 237, 0.55), transparent 60%),
        radial-gradient(closest-side at 80% 30%, rgba(34, 211, 238, 0.28), transparent 65%),
        radial-gradient(closest-side at 50% 90%, rgba(244, 114, 182, 0.28), transparent 70%);
      filter: blur(60px) saturate(140%);
      opacity: .55; pointer-events: none;
      animation: aurora 22s var(--ease) infinite alternate;
    }
    .device::after {
      background:
        radial-gradient(closest-side at 70% 70%, rgba(167, 139, 250, 0.35), transparent 65%),
        radial-gradient(closest-side at 15% 80%, rgba(59, 130, 246, 0.28), transparent 70%);
      animation-duration: 30s; animation-direction: alternate-reverse; opacity: .45;
    }
    @keyframes aurora {
      0%   { transform: translate(0,0) scale(1); }
      100% { transform: translate(4%,-3%) scale(1.08); }
    }

    /* Grain / noise overlay */
    .device .noise {
      position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: .04;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.6'/></svg>");
      mix-blend-mode: overlay;
    }

    /* Fullscreen quando a viewport é próxima do ecrã do ESP32 (240x320)
       ou de qualquer telemóvel/tablet pequeno em retrato ou paisagem.    */
    @media (max-width: 480px), (max-height: 360px), (orientation: portrait) {
      body { overflow: auto; }
      .device { aspect-ratio: auto; width: 100vw; height: 100dvh; border-radius: 0; border: none; }
    }

    /* Retrato "cheio" (ex.: telemóvel) — dá altura confortável ao conteúdo. */
    @media (orientation: portrait) and (min-width: 360px) {
      .device { min-height: 100dvh; }
    }

    /* (Nota: as media queries de ecrã compacto foram movidas para o fim
       da folha de estilos, para garantirem sempre prioridade sobre as
       regras base — ver perto do fecho do style.) 

    /* ==============================================================
       BARRA DE ESTADO (fixa, em todas as páginas)
    ============================================================== */
    .status-bar {
      position: absolute; top: 0; left: 0; right: 0;
      height: 30px; z-index: 30;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px;
      color: var(--text);
      font-size: 11px; font-weight: 500;
      background: linear-gradient(180deg, rgba(5,3,12,0.75) 0%, rgba(5,3,12,0) 100%);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      cursor: grab;
    }
    .status-bar:active { cursor: grabbing; }
    .status-bar .sb-left { display: flex; align-items: center; gap: 8px; }
    .status-bar .sb-left .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--accent); box-shadow: 0 0 8px var(--glow); }
    .status-bar .sb-right { display: flex; align-items: center; gap: 10px; }
    .status-bar .sb-right i { font-size: 11px; color: var(--text-dim); }
    .status-bar .sb-right i.on { color: var(--accent); text-shadow: 0 0 8px var(--glow); }
    .status-bar .sb-battery { display: flex; align-items: center; gap: 4px; }
    .status-bar .sb-hint {
      position: absolute; left: 50%; top: 22px; transform: translateX(-50%);
      width: 44px; height: 3px; border-radius: 999px;
      background: rgba(255,255,255,0.22);
      transition: width var(--dur) var(--ease), background var(--dur) var(--ease);
    }
    .status-bar:hover .sb-hint { width: 70px; background: rgba(255,255,255,0.4); }

    /* ==============================================================
       PAINEL DE CONTROLO RÁPIDO (arrastar da barra de estado)
    ============================================================== */
    .quick-panel {
      position: absolute; top: 0; left: 0; right: 0;
      z-index: 40;
      display: flex; flex-direction: column;
      max-height: 100%; min-height: 0;
      background: rgba(10, 7, 22, 0.92);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border-bottom: 1px solid var(--stroke);
      transform: translateY(-105%);
      transition: transform 380ms var(--ease);
      padding: 40px 18px 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.55);
    }
    .quick-panel.open { transform: translateY(0); }
    .qp-scroll {
      flex: 1; min-height: 0; overflow-y: auto;
      padding: 0 2px 34px 0;
      scrollbar-width: thin;
      scrollbar-color: var(--stroke-strong) transparent;
      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
    }
    .qp-scroll::-webkit-scrollbar { width: 4px; }
    .qp-scroll::-webkit-scrollbar-track { background: transparent; }
    .qp-scroll::-webkit-scrollbar-thumb { background: var(--stroke-strong); border-radius: 999px; }
    .quick-panel .qp-drag {
      position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
      width: 60px; height: 4px; border-radius: 999px;
      background: rgba(255,255,255,0.35); cursor: grab;
    }
    .quick-panel .qp-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px;
    }
    .quick-panel .qp-header .qp-title { display: flex; flex-direction: column; }
    .quick-panel .qp-header .qp-title strong { font-size: 13px; font-weight: 600; }
    .quick-panel .qp-header .qp-title small { color: var(--text-mute); font-size: 10px; }
    .qp-close {
      background: var(--bg-elev); border: 1px solid var(--stroke); color: var(--text);
      width: 28px; height: 28px; border-radius: 999px; cursor: pointer;
    }

    .qp-tiles {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
      margin-bottom: 14px;
    }
    @media (min-width: 480px) {
      .qp-tiles { grid-template-columns: repeat(4, 1fr); }
    }
    .qp-tile {
      background: var(--bg-elev); border: 1px solid var(--stroke);
      border-radius: var(--r-md); padding: 10px;
      display: flex; align-items: center; gap: 10px; cursor: pointer;
      transition: transform var(--dur) var(--ease), background var(--dur) var(--ease), border-color var(--dur) var(--ease);
    }
    .qp-tile:hover { background: var(--bg-elev-hover); }
    .qp-tile:active { transform: scale(0.96); }
    .qp-tile.on {
      background: linear-gradient(135deg, rgba(167,139,250,0.28), rgba(124,58,237,0.15));
      border-color: rgba(167,139,250,0.6);
      box-shadow: 0 0 24px rgba(139,92,246,0.25);
    }
    .qp-tile .qp-ic {
      width: 34px; height: 34px; border-radius: 10px;
      background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: var(--text-dim); flex-shrink: 0;
    }
    .qp-tile.on .qp-ic { background: var(--accent); color: #fff; box-shadow: 0 0 12px var(--glow); }
    .qp-tile .qp-txt { display: flex; flex-direction: column; min-width: 0; }
    .qp-tile .qp-txt strong { font-size: 11px; font-weight: 600; }
    .qp-tile .qp-txt small { color: var(--text-mute); font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .qp-slider {
      background: var(--bg-elev); border: 1px solid var(--stroke);
      border-radius: var(--r-md); padding: 10px 14px;
      display: flex; align-items: center; gap: 12px; margin-bottom: 8px;
    }
    .qp-slider i { color: var(--text-dim); width: 16px; text-align: center; }
    .qp-slider .qp-val { color: var(--text-dim); font-size: 10px; min-width: 30px; text-align: right; }
    .qp-slider input[type="range"] { flex: 1; }

    /* Widgets do painel rápido (música + agenda) */
    .qp-widget {
      background: var(--bg-elev); border: 1px solid var(--stroke);
      border-radius: var(--r-md); padding: 12px; margin-bottom: 8px;
      transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease);
    }
    .qp-widget:hover { background: var(--bg-elev-hover); }
    .qp-widget-clickable { cursor: pointer; }
    .qp-widget-clickable:active { background: var(--bg-elev-hover); border-color: var(--accent); transform: scale(0.99); }
    .qp-widget-clickable .qp-music-controls i { cursor: pointer; }
    .qp-widget-head {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 8px;
    }
    .qp-widget-head .qp-w-title {
      display: flex; align-items: center; gap: 8px;
      font-size: 11px; font-weight: 600; color: var(--text);
    }
    .qp-widget-head .qp-w-title i { color: var(--accent); font-size: 13px; }
    .qp-widget-head .qp-w-sub { font-size: 9px; color: var(--text-mute); }
    .qp-widget-body { font-size: 11px; color: var(--text-dim); }
    .qp-music-row { display: flex; align-items: center; gap: 10px; }
    .qp-music-art {
      width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0;
      background: linear-gradient(135deg, #1DB954, #1ed760);
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 16px;
    }
    .qp-music-info { flex: 1; min-width: 0; }
    .qp-music-info strong { font-size: 12px; font-weight: 600; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .qp-music-info small { font-size: 10px; color: var(--text-mute); }
    .qp-music-controls { display: flex; align-items: center; gap: 12px; }
    .qp-music-controls i { cursor: pointer; color: var(--text-dim); font-size: 16px; transition: color var(--dur) var(--ease), transform 120ms var(--ease); }
    .qp-music-controls i:hover { color: var(--text); }
    .qp-music-controls i:active { transform: scale(0.9); }
    .qp-music-controls .qp-play { color: var(--accent); font-size: 22px; filter: drop-shadow(0 0 8px var(--glow)); }
    .qp-agenda-item { display: flex; align-items: center; gap: 10px; padding: 4px 0; }
    .qp-agenda-item + .qp-agenda-item { border-top: 1px solid var(--stroke); margin-top: 4px; padding-top: 8px; }
    .qp-agenda-time { font-size: 10px; color: var(--accent); font-weight: 600; min-width: 36px; }
    .qp-agenda-txt { font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ==============================================================
       ECRÃS
    ============================================================== */
    .screens { position: absolute; inset: 0; z-index: 5; }
    .screen {
      display: none; position: absolute; inset: 0;
      padding: 40px 18px 14px; overflow: hidden;
      animation: screenIn 320ms var(--ease);
    }
    .screen.active { display: flex; flex-direction: column; }
    @keyframes screenIn {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to   { opacity: 1; transform: none; }
    }

    /* ---------- Launcher ---------- */
    #screen-launcher { justify-content: flex-start; }
    .launcher-head { text-align: left; margin: 4px 2px 14px; display: flex; align-items: baseline; justify-content: space-between; }
    .launcher-head h1 {
      font-size: clamp(18px, 4.5vw, 28px); font-weight: 300; letter-spacing: -0.02em;
    }
    .launcher-head h1 span {
      font-weight: 700;
      background: linear-gradient(120deg, var(--accent) 0%, var(--accent-cyan) 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .launcher-head p { color: var(--text-mute); font-size: 11px; margin-top: 2px; }
    .launcher-date { text-align: right; }
    .launcher-date b { font-size: 22px; font-weight: 500; display: block; }
    .launcher-date small { color: var(--text-mute); font-size: 10px; text-transform: capitalize; }

    .launcher-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(10px, 2.4vw, 18px);
      align-content: start;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 2px 2px 8px;
    }
    @media (max-width: 420px), (max-height: 320px), (orientation: portrait) and (max-width: 480px) {
      .launcher-grid { grid-template-columns: repeat(3, 1fr); }
    }

    /* Ecrã ES3C28P nativo (240x320) — máximo compacto */
    @media (max-width: 260px), (max-height: 340px) and (orientation: portrait) {
      .launcher-grid { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .app-item small { display: none; }
    }

    .app-item {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      cursor: pointer; text-align: center; padding: 6px 4px; border-radius: var(--r-lg);
      animation: itemIn 420ms var(--ease) both;
    }
    @keyframes itemIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .app-item:active { transform: scale(0.94); }

    .app-icon {
      width: clamp(46px, 12vw, 66px); height: clamp(46px, 12vw, 66px);
      border-radius: 20px;
      background: linear-gradient(160deg, rgba(255,255,255,0.09) 0%, rgba(255,255,255,0.02) 100%);
      border: 1px solid var(--stroke);
      backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(18px, 5vw, 26px);
      box-shadow: 0 10px 24px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.12);
      transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), border-color var(--dur) var(--ease);
      position: relative; overflow: hidden;
    }
    .app-icon::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit;
      background: radial-gradient(80% 80% at 50% 30%, currentColor, transparent 65%);
      opacity: .18; filter: blur(6px); pointer-events: none;
    }
    .app-icon::after {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(120% 100% at 50% 0%, rgba(255,255,255,0.14), transparent 60%);
      pointer-events: none;
    }
    .app-item:hover .app-icon { transform: translateY(-2px); border-color: currentColor; box-shadow: 0 16px 32px rgba(0,0,0,0.55), 0 0 26px currentColor; }
    .app-item span { font-size: 11px; font-weight: 500; color: var(--text); }
    .app-item small { color: var(--text-mute); font-size: 9px; line-height: 1.2; }

    /* ---------- Cabeçalho de app ---------- */
    .app-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .back-btn {
      background: var(--bg-elev); border: 1px solid var(--stroke);
      color: var(--text); width: 34px; height: 34px; border-radius: 12px;
      cursor: pointer; font-size: 13px; flex-shrink: 0;
      transition: background var(--dur) var(--ease), transform var(--dur) var(--ease);
    }
    .back-btn:hover { background: var(--bg-elev-hover); }
    .back-btn:active { transform: scale(0.9); }
    .app-header h2 { font-size: clamp(15px, 3.8vw, 20px); flex: 1; font-weight: 600; letter-spacing: -0.01em; }
    .app-header .app-icon-mini {
      width: 34px; height: 34px; border-radius: 12px;
      background: var(--bg-elev); border: 1px solid var(--stroke);
      display: flex; align-items: center; justify-content: center; font-size: 15px;
    }
    .app-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 2px; }
    .app-body::-webkit-scrollbar { width: 4px; }
    .app-body::-webkit-scrollbar-thumb { background: var(--stroke-strong); border-radius: 999px; }
    .launcher-grid::-webkit-scrollbar { width: 4px; }
    .launcher-grid::-webkit-scrollbar-thumb { background: var(--stroke-strong); border-radius: 999px; }

    /* ---------- Cartões ---------- */
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,0.055) 0%, rgba(255,255,255,0.028) 100%);
      border: 1px solid var(--stroke);
      backdrop-filter: blur(14px) saturate(150%);
      -webkit-backdrop-filter: blur(14px) saturate(150%);
      border-radius: var(--r-lg);
      padding: 14px 16px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.07), 0 4px 18px rgba(0,0,0,0.28);
      position: relative;
    }
    .card::before {
      content: ""; position: absolute; inset: 0; border-radius: inherit;
      pointer-events: none;
      background: radial-gradient(140% 90% at 0% 0%, rgba(167,139,250,0.08), transparent 55%);
    }
    .card-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; position: relative; }
    .card-title strong { font-size: 13px; font-weight: 600; letter-spacing: -0.01em; }
    .card-title small { color: var(--text-mute); font-size: 10px; }

    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
    .row + .row { margin-top: 12px; }
    .row-label { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 auto; }
    .row-label strong { font-size: 12px; font-weight: 500; overflow-wrap: break-word; word-break: break-word; }
    .row-label small { color: var(--text-mute); font-size: 10px; overflow-wrap: break-word; }

    /* ---------- Botões ---------- */
    .btn {
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent-2) 100%);
      color: #fff; border: 1px solid rgba(255,255,255,0.14);
      padding: 8px 16px;
      border-radius: 999px; cursor: pointer; font-size: 12px; font-weight: 500;
      font-family: inherit;
      white-space: nowrap;
      box-shadow: 0 6px 18px rgba(124,58,237,0.35), inset 0 1px 0 rgba(255,255,255,0.18);
      transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), filter var(--dur) var(--ease);
    }
    .btn:hover { filter: brightness(1.08); box-shadow: 0 8px 24px rgba(124,58,237,0.5), inset 0 1px 0 rgba(255,255,255,0.22); }
    .btn:active { transform: scale(0.96); }
    .btn.ghost {
      background: var(--bg-elev); color: var(--text);
      border: 1px solid var(--stroke); box-shadow: none;
    }
    .btn.ghost:hover { background: var(--bg-elev-hover); }
    .btn.ghost.active {
      background: linear-gradient(135deg, rgba(167,139,250,0.28), rgba(124,58,237,0.15));
      border-color: rgba(167,139,250,0.6); color: #fff;
      box-shadow: 0 4px 14px rgba(124,58,237,0.35);
    }
    .btn.ok  { background: linear-gradient(180deg, #4ade80, #22c55e); box-shadow: 0 6px 18px rgba(34,197,94,0.35); }
    .btn.err { background: linear-gradient(180deg, #fb7185, #ef4444); box-shadow: 0 6px 18px rgba(239,68,68,0.35); }
    .btn.sm  { padding: 5px 12px; font-size: 10px; }

    /* ---------- Switch, select, range, input ---------- */
    .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider-toggle {
      position: absolute; cursor: pointer; inset: 0;
      background: rgba(255,255,255,0.12); border: 1px solid var(--stroke);
      transition: background var(--dur) var(--ease); border-radius: 999px;
    }
    .slider-toggle::before {
      position: absolute; content: ""; height: 18px; width: 18px;
      left: 2px; top: 2px; background: #fff; transition: transform var(--dur) var(--ease); border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    input:checked + .slider-toggle {
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      border-color: transparent;
      box-shadow: 0 0 12px var(--glow);
    }
    input:checked + .slider-toggle::before { transform: translateX(18px); }

    /* ---------- Input ---------- */
    input.dc-input {
      background: var(--bg-elev); color: var(--text);
      border: 1px solid var(--stroke); border-radius: var(--r-sm);
      padding: 6px 10px; font-size: 12px; font-family: inherit;
      flex-shrink: 1; min-width: 0; max-width: 60%;
      transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
    }
    input.dc-input:focus {
      outline: none; border-color: var(--accent); background: var(--bg-elev-2);
      box-shadow: 0 0 0 3px rgba(167,139,250,0.15);
    }
    textarea.dc-input {
      background: var(--bg-elev); color: var(--text);
      border: 1px solid var(--stroke); border-radius: var(--r-sm);
      font-size: 12px; font-family: inherit; line-height: 1.5;
      transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
    }
    textarea.dc-input:focus {
      outline: none; border-color: var(--accent); background: var(--bg-elev-2);
      box-shadow: 0 0 0 3px rgba(167,139,250,0.15);
    }

    /* ---------- Custom Select (padronizado) ----------
       O `<select class="dc-select">` original fica escondido; um
       botão + painel personalizados são injetados por JS (initCustomSelects). */
    .dc-select-native { display: none !important; }

    .dc-select-wrap {
      position: relative;
      flex-shrink: 1; min-width: 0;
      max-width: 60%;
    }
    .dc-select-btn {
      width: 100%;
      background: var(--bg-elev); color: var(--text);
      border: 1px solid var(--stroke); border-radius: var(--r-sm);
      padding: 6px 30px 6px 12px;
      font-size: 12px; font-family: inherit; font-weight: 500;
      text-align: left; cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      transition: background var(--dur) var(--ease), border-color var(--dur) var(--ease),
                  box-shadow var(--dur) var(--ease);
      position: relative;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .dc-select-btn::after {
      content: ""; position: absolute; right: 10px; top: 50%;
      width: 10px; height: 6px; margin-top: -3px;
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%23a78bfa' stroke-width='1.6' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>") no-repeat center / contain;
      transition: transform var(--dur) var(--ease);
    }
    .dc-select-btn:hover { background: var(--bg-elev-hover); border-color: var(--stroke-strong); }
    .dc-select-wrap.open .dc-select-btn {
      border-color: var(--accent); background: var(--bg-elev-2);
      box-shadow: 0 0 0 3px rgba(167,139,250,0.18);
    }
    .dc-select-wrap.open .dc-select-btn::after { transform: rotate(180deg); }

    .dc-select-menu {
      position: absolute; z-index: 50;
      top: calc(100% + 6px); right: 0;
      min-width: 100%; max-width: 200px;
      background: rgba(14, 10, 28, 0.96);
      backdrop-filter: blur(20px) saturate(160%);
      -webkit-backdrop-filter: blur(20px) saturate(160%);
      border: 1px solid var(--stroke-strong);
      border-radius: var(--r-md);
      box-shadow: 0 18px 40px rgba(0,0,0,0.55), 0 0 24px rgba(124,58,237,0.18);
      padding: 4px;
      max-height: 180px; overflow-y: auto;
      opacity: 0; transform: translateY(-4px) scale(0.98);
      pointer-events: none;
      transition: opacity var(--dur) var(--ease), transform var(--dur) var(--ease);
    }
    .dc-select-wrap.open .dc-select-menu { opacity: 1; transform: none; pointer-events: auto; }
    .dc-select-wrap.up .dc-select-menu { top: auto; bottom: calc(100% + 6px); }

    .dc-select-option {
      padding: 7px 12px; border-radius: 8px;
      font-size: 12px; color: var(--text); cursor: pointer;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      transition: background var(--dur) var(--ease), color var(--dur) var(--ease);
      white-space: nowrap;
    }
    .dc-select-option:hover { background: var(--bg-elev-hover); }
    .dc-select-option.selected {
      background: linear-gradient(135deg, rgba(167,139,250,0.22), rgba(124,58,237,0.15));
      color: #fff;
    }
    .dc-select-option.selected::after {
      content: "\f00c"; font-family: "Font Awesome 6 Free"; font-weight: 900;
      font-size: 10px; color: var(--accent);
    }
    .dc-select-menu::-webkit-scrollbar { width: 4px; }
    .dc-select-menu::-webkit-scrollbar-thumb { background: var(--stroke-strong); border-radius: 999px; }

    .range { -webkit-appearance: none; appearance: none;
      height: 6px; background: rgba(255,255,255,0.1);
      border: none; border-radius: 999px; width: 120px; outline: none;
    }
    .range::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 12px var(--glow); cursor: pointer;
      border: 2px solid #fff;
    }
    .range::-moz-range-thumb {
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--accent); cursor: pointer; border: 2px solid #fff;
    }

    /* ---------- Assistente ---------- */
    .chat-log { flex: 1; min-height: 64px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 12px; line-height: 1.4;
           animation: msgIn 320ms var(--ease); }
    @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; border-bottom-right-radius: 4px;
      box-shadow: 0 4px 14px rgba(124,58,237,0.35);
    }
    .msg.bot {
      align-self: flex-start; background: var(--bg-elev); border: 1px solid var(--stroke);
      border-bottom-left-radius: 4px;
    }
    .msg.bot-err { border-color: var(--err); }
    .chat-input { display: flex; gap: 8px; margin-top: 8px; }
    .chat-input input:disabled { opacity: 0.6; }
    .chat-input .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .chat-input input {
      flex: 1; background: var(--bg-elev); border: 1px solid var(--stroke);
      color: var(--text); border-radius: 999px; padding: 10px 16px; font-size: 12px; min-width: 0;
      font-family: inherit;
    }
    .chat-input input:focus { outline: none; border-color: var(--accent); background: var(--bg-elev-2); }
    .quick-cmds { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
    .quick-cmds .btn { font-size: 10px; padding: 5px 12px; }

    /* ---------- Tabs ---------- */
    .app-tabs { display: flex; gap: 6px; margin-bottom: 4px; }
    .app-tabs-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 4px; }
    .app-tabs-row .app-tabs { margin-bottom: 0; min-width: 0; }
    .app-tabs-row .gw-status { flex-shrink: 0; }
    .app-tabs .tab-btn {
      background: var(--bg-elev); border: 1px solid var(--stroke); color: var(--text-dim);
      padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 11px; font-family: inherit;
      transition: all var(--dur) var(--ease);
    }
    .app-tabs .tab-btn:hover { color: var(--text); }
    .app-tabs .tab-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; border-color: transparent;
      box-shadow: 0 4px 14px rgba(124,58,237,0.4);
    }

    /* ---------- Monitorização ---------- */
    .sensor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .sensor { text-align: center; padding: 14px 8px; }
    .sensor .val { font-size: clamp(18px, 5vw, 26px); font-weight: 700; letter-spacing: -0.02em; }
    .sensor .lbl { color: var(--text-mute); font-size: 10px; margin-top: 2px; }
    .bar-chart { display: flex; align-items: flex-end; gap: 5px; height: 70px; margin-top: 8px; }
    .bar-chart .bar {
      flex: 1;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      border-radius: 4px 4px 0 0; opacity: .9;
      box-shadow: 0 0 8px rgba(139,92,246,0.35);
    }

    /* ---------- Alarmes ---------- */
    .alarm-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
    .alarm-item .prio { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 8px currentColor; }
    .prio.alta { background: var(--err); color: var(--err); }
    .prio.media { background: var(--warn); color: var(--warn); }
    .prio.baixa { background: var(--ok); color: var(--ok); }

    /* ---------- Chips ---------- */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      background: var(--bg-elev); border: 1px solid var(--stroke);
      padding: 5px 12px; border-radius: 999px; cursor: pointer;
      font-size: 10px; color: var(--text-dim); transition: all var(--dur) var(--ease);
    }
    .chip:hover { color: var(--text); }
    .chip.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; border-color: transparent;
      box-shadow: 0 4px 12px rgba(124,58,237,0.35);
    }

    .muted { color: var(--text-mute); }
    .store-item { display: flex; align-items: center; gap: 12px; }
    .store-item .app-icon { width: 44px; height: 44px; border-radius: 14px; font-size: 18px; flex-shrink: 0; }
    .store-meta { color: var(--text-mute); font-size: 10px; }

    /* ==============================================================
       MODAL (unificado) — confirmações, escolhas, alertas
    ============================================================== */
    .modal-backdrop {
      position: absolute; inset: 0; z-index: 60;
      background: rgba(3, 1, 8, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity var(--dur) var(--ease);
      padding: 20px;
    }
    .modal-backdrop.open { opacity: 1; pointer-events: auto; }
    .modal {
      width: min(360px, 100%);
      background: linear-gradient(180deg, rgba(20,14,36,0.98), rgba(10,7,22,0.98));
      border: 1px solid var(--stroke-strong);
      border-radius: var(--r-lg);
      padding: 20px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 40px rgba(124,58,237,0.25);
      transform: translateY(10px) scale(0.96); opacity: 0;
      transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease);
    }
    .modal-backdrop.open .modal { transform: none; opacity: 1; }
    .modal-icon {
      width: 48px; height: 48px; border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: #fff; margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(124,58,237,0.45);
    }
    .modal.err .modal-icon { background: linear-gradient(135deg, #fb7185, #ef4444); box-shadow: 0 8px 24px rgba(239,68,68,0.45); }
    .modal.warn .modal-icon { background: linear-gradient(135deg, #fbbf24, #f59e0b); box-shadow: 0 8px 24px rgba(245,158,11,0.45); }
    .modal.ok .modal-icon { background: linear-gradient(135deg, #4ade80, #22c55e); box-shadow: 0 8px 24px rgba(34,197,94,0.45); }
    .modal h3 { font-size: 15px; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.01em; }
    .modal p { color: var(--text-dim); font-size: 12px; line-height: 1.5; margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

    /* ==============================================================
       TOASTS (notificações no estilo do sistema)
    ============================================================== */
    .toast-stack {
      position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
      z-index: 55; display: flex; flex-direction: column; gap: 8px;
      width: min(340px, 88%); pointer-events: none;
    }
    .toast {
      background: rgba(20,14,36,0.9); backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border: 1px solid var(--stroke-strong);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      transform: translateY(-8px); opacity: 0;
      transition: transform 300ms var(--ease), opacity 300ms var(--ease);
      pointer-events: auto;
    }
    .toast.show { transform: none; opacity: 1; }
    .toast .toast-ic {
      width: 28px; height: 28px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; font-size: 12px; flex-shrink: 0;
    }
    .toast.ok .toast-ic  { background: linear-gradient(135deg, #4ade80, #22c55e); }
    .toast.warn .toast-ic{ background: linear-gradient(135deg, #fbbf24, #f59e0b); }
    .toast.err .toast-ic { background: linear-gradient(135deg, #fb7185, #ef4444); }
    .toast .toast-txt { display: flex; flex-direction: column; min-width: 0; }
    .toast .toast-txt strong { font-size: 12px; font-weight: 600; }
    .toast .toast-txt small { color: var(--text-mute); font-size: 10px; }

    /* ==============================================================
       SPLASH SCREEN
    ============================================================== */
    .splash {
      position: absolute; inset: 0; z-index: 100;
      background: radial-gradient(ellipse at center, #14092b 0%, #05030c 70%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px;
      transition: opacity 700ms var(--ease), visibility 700ms var(--ease);
    }
    .splash.hide { opacity: 0; visibility: hidden; }
    .splash .logo-wrap { position: relative; width: 96px; height: 96px; }
    .splash .logo-ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--accent);
      border-right-color: var(--accent-cyan);
      animation: spin 1.4s linear infinite;
      filter: drop-shadow(0 0 12px var(--glow));
    }
    .splash .logo-ring.slow {
      inset: 10px;
      border-top-color: var(--accent-pink);
      border-right-color: transparent;
      animation-duration: 2.2s;
      animation-direction: reverse;
    }
    .splash .logo-core {
      position: absolute; inset: 20px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 24px; font-weight: 800; letter-spacing: -0.02em;
      box-shadow: 0 0 40px var(--glow), inset 0 2px 8px rgba(255,255,255,0.25);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 30px var(--glow), inset 0 2px 8px rgba(255,255,255,0.25); }
      50%      { transform: scale(1.05); box-shadow: 0 0 50px var(--glow), inset 0 2px 8px rgba(255,255,255,0.35); }
    }
    .splash .title {
      font-size: 28px; font-weight: 300; letter-spacing: -0.02em;
      opacity: 0; animation: splashFade 900ms var(--ease) 300ms forwards;
    }
    .splash .title b {
      font-weight: 700;
      background: linear-gradient(120deg, var(--accent) 0%, var(--accent-cyan) 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .splash .tag {
      color: var(--text-mute); font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
      opacity: 0; animation: splashFade 900ms var(--ease) 600ms forwards;
    }
    @keyframes splashFade { to { opacity: 1; } }

    .hidden { display: none !important; }

    /* ==============================================================
       WALLPAPER (Papel de parede) — controlado por data-wallpaper
    ============================================================== */
    /* Ocultar aurora quando o utilizador escolhe outro papel */
    .device[data-wallpaper="solid"]::before,
    .device[data-wallpaper="solid"]::after,
    .device[data-wallpaper="image"]::before,
    .device[data-wallpaper="image"]::after { display: none; }

    .wallpaper-image {
      position: absolute; inset: 0; z-index: 0; pointer-events: none;
      background-size: cover; background-position: center; background-repeat: no-repeat;
    }
    .wallpaper-solid {
      position: absolute; inset: 0; z-index: 0; pointer-events: none;
    }

    /* Wallpaper picker (grelha de opcoes) */
    .wp-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 10px; margin-top: 8px;
    }
    .wp-swatch {
      aspect-ratio: 1.4/1; border-radius: 12px;
      border: 2px solid var(--stroke); cursor: pointer;
      position: relative; overflow: hidden;
      transition: transform var(--dur) var(--ease), border-color var(--dur) var(--ease);
    }
    .wp-swatch:hover { transform: translateY(-2px); border-color: var(--stroke-strong); }
    .wp-swatch.selected { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(167,139,250,0.35); }
    .wp-swatch .wp-label {
      position: absolute; left: 6px; bottom: 4px; font-size: 9px;
      color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,0.7);
    }
    .wp-aurora {
      background:
        radial-gradient(closest-side at 20% 20%, rgba(124, 58, 237, 0.9), transparent 60%),
        radial-gradient(closest-side at 80% 30%, rgba(34, 211, 238, 0.6), transparent 65%),
        radial-gradient(closest-side at 50% 90%, rgba(244, 114, 182, 0.6), transparent 70%),
        #05030c;
    }

    /* ==============================================================
       LOCK SCREEN (Bloqueio por PIN)
    ============================================================== */
    .lock-screen {
      position: absolute; inset: 0; z-index: 200;
      display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 14px; padding: 30px 20px;
      background: rgba(5,3,12,0.78);
      backdrop-filter: blur(24px) saturate(140%);
      -webkit-backdrop-filter: blur(24px) saturate(140%);
    }
    .lock-screen.open { display: flex; }
    .lock-screen .lock-ic {
      width: 52px; height: 52px; border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      background: var(--bg-elev-2); border: 1px solid var(--stroke-strong);
      color: var(--accent); font-size: 22px;
      box-shadow: 0 0 24px rgba(167,139,250,0.35);
    }
    .lock-screen h3 { font-size: 16px; font-weight: 600; }
    .lock-screen .lock-hint { color: var(--text-dim); font-size: 11px; }
    .lock-dots {
      display: flex; gap: 10px; margin: 4px 0 2px;
    }
    .lock-dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--bg-elev-2); border: 1px solid var(--stroke-strong);
      transition: background var(--dur) var(--ease), transform var(--dur) var(--ease);
    }
    .lock-dot.filled { background: var(--accent); border-color: var(--accent); transform: scale(1.1); }
    .lock-screen.shake .lock-dots { animation: shake 0.4s var(--ease); }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      25% { transform: translateX(-8px); }
      75% { transform: translateX(8px); }
    }
    .pin-pad {
      display: grid; grid-template-columns: repeat(3, 56px);
      gap: 8px; margin-top: 6px;
    }
    .pin-key {
      height: 42px; border-radius: 12px;
      background: var(--bg-elev); border: 1px solid var(--stroke);
      color: var(--text); font-size: 16px; font-weight: 500;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: background var(--dur) var(--ease), transform 120ms var(--ease);
    }
    .pin-key:hover { background: var(--bg-elev-hover); }
    .pin-key:active { transform: scale(0.94); }
    .pin-key.wide { grid-column: span 1; }
    .pin-key.act { color: var(--accent); }

    /* ==============================================================
       PAINEL RAPIDO — modo edicao e tiles arrastaveis
    ============================================================== */
    .qp-edit-btn {
      position: absolute; top: 14px; right: 60px;
      width: 32px; height: 32px; border-radius: 10px;
      background: var(--bg-elev); border: 1px solid var(--stroke);
      color: var(--text-dim); cursor: pointer; z-index: 5;
      display: flex; align-items: center; justify-content: center;
      transition: color var(--dur) var(--ease), background var(--dur) var(--ease);
    }
    .qp-edit-btn:hover { color: var(--text); background: var(--bg-elev-hover); }
    .qp-edit-btn.active { color: var(--accent); border-color: var(--accent); }

    .quick-panel.editing .qp-tile { cursor: grab; }
    .quick-panel.editing .qp-tile:active { cursor: grabbing; }
    .qp-tile.dragging { opacity: 0.35; transform: scale(0.96); }
    .qp-tile.drag-over { outline: 2px dashed var(--accent); outline-offset: -2px; }
    .qp-tile .qp-hide {
      position: absolute; top: 4px; right: 4px;
      width: 18px; height: 18px; border-radius: 50%;
      background: rgba(0,0,0,0.5); color: #fff;
      display: none; align-items: center; justify-content: center;
      font-size: 9px; cursor: pointer;
      border: 1px solid var(--stroke-strong);
    }
    .quick-panel.editing .qp-tile { position: relative; }
    .quick-panel.editing .qp-tile .qp-hide { display: flex; }

    .qp-hidden-section {
      display: none; margin-top: 6px;
      padding: 8px; border-radius: 12px;
      background: var(--bg-elev); border: 1px dashed var(--stroke);
    }
    .quick-panel.editing .qp-hidden-section.has-hidden { display: block; }
    .qp-hidden-title { font-size: 10px; color: var(--text-mute); margin-bottom: 6px; }
    .qp-hidden-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .qp-hidden-chip {
      padding: 4px 10px; border-radius: 999px; font-size: 10px;
      background: var(--bg-elev-2); border: 1px solid var(--stroke);
      cursor: pointer; color: var(--text-dim);
    }
    .qp-hidden-chip:hover { color: var(--text); border-color: var(--accent); }

    /* Aviso de estado do Gateway */
    .gw-status {

  /* ==============================================================

  <script>
    /* ================================================================
       CUSTOM SELECT — transforma <select class="dc-select"> em dropdown estilizado
    ================================================================ */
    function buildCustomSelect(sel) {
      if (sel.dataset.dcInit === '1') return;
      sel.dataset.dcInit = '1';
      sel.classList.add('dc-select-native');

      const wrap = document.createElement('div');
      wrap.className = 'dc-select-wrap';

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'dc-select-btn';
      btn.innerHTML = `<span class="dc-select-label"></span>`;

      const menu = document.createElement('div');
      menu.className = 'dc-select-menu';

      const syncLabel = () => {
        const opt = sel.options[sel.selectedIndex];
        btn.querySelector('.dc-select-label').textContent = opt ? opt.textContent : '';
        menu.querySelectorAll('.dc-select-option').forEach((n, i) => {
          n.classList.toggle('selected', i === sel.selectedIndex);
        });
      };

      const rebuildMenu = () => {
        menu.innerHTML = '';
        [...sel.options].forEach((opt, i) => {
          const item = document.createElement('div');
          item.className = 'dc-select-option' + (i === sel.selectedIndex ? ' selected' : '');
          item.textContent = opt.textContent;
          item.onclick = (e) => {
            e.stopPropagation();
            sel.selectedIndex = i;
            sel.dispatchEvent(new Event('change', { bubbles: true }));
            syncLabel();
            closeWrap();
          };
          menu.appendChild(item);
        });
      };

      const closeWrap = () => wrap.classList.remove('open', 'up');
      const openWrap = () => {
        // fechar outros
        document.querySelectorAll('.dc-select-wrap.open').forEach(w => {
          if (w !== wrap) w.classList.remove('open', 'up');
        });
        wrap.classList.add('open');
        // decidir se abre para cima
        const r = btn.getBoundingClientRect();
        const dev = document.getElementById('device').getBoundingClientRect();
        if (dev.bottom - r.bottom < 180) wrap.classList.add('up');
      };

      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        wrap.classList.contains('open') ? closeWrap() : openWrap();
      });

      // Inserir no DOM: envolver o <select>
      sel.parentNode.insertBefore(wrap, sel);
      wrap.appendChild(btn);
      wrap.appendChild(menu);
      wrap.appendChild(sel);

      rebuildMenu();
      syncLabel();

      sel.addEventListener('change', syncLabel);
    }

    function initCustomSelects(root = document) {
      root.querySelectorAll('select.dc-select:not([data-dc-init="1"])').forEach(buildCustomSelect);
    }

    // Fechar dropdowns ao clicar fora
    document.addEventListener('click', () => {
      document.querySelectorAll('.dc-select-wrap.open').forEach(w => w.classList.remove('open', 'up'));
    });

    // Observar re-renders do app-body / painel do assistente e converter novos selects
    (function watchRenders() {
      const start = () => {
        const obs = new MutationObserver(muts => {
          for (const m of muts) {
            if (m.addedNodes && m.addedNodes.length) { initCustomSelects(document); break; }
          }
        });
        obs.observe(document.getElementById('device'), { childList: true, subtree: true });
      };
      if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
      else start();
    })();

    /* ================================================================
       APP REGISTRY
    ================================================================ */
    const APPS = [
      { id: 'assistant',    name: 'DC Assistant',   icon: 'fa-solid fa-robot',           color: '#a78bfa', desc: 'Assistente inteligente' },
      { id: 'controlo',     name: 'Controlo',       icon: 'fa-solid fa-sliders',         color: '#22d3ee', desc: 'Comandos do sistema' },
      { id: 'monitorizacao',name: 'Monitorização',  icon: 'fa-solid fa-chart-line',      color: '#60a5fa', desc: 'Tempo real e histórico' },
      { id: 'alarmes',      name: 'Alarmes',        icon: 'fa-solid fa-bell',            color: '#f87171', desc: 'Central de alarmes' },
      { id: 'agenda',       name: 'Agenda',         icon: 'fa-regular fa-calendar-days', color: '#fbbf24', desc: 'Tarefas e eventos' },
      { id: 'musica',       name: 'Música',         icon: 'fa-brands fa-spotify',        color: '#1DB954', desc: 'Multimédia' },
      { id: 'loja',         name: 'Loja',           icon: 'fa-solid fa-store',           color: '#f472b6', desc: 'App Store' },
      { id: 'definicoes',   name: 'Definições',     icon: 'fa-solid fa-gear',            color: '#94a3b8', desc: 'Sistema' },
    ];
    const appById = id => APPS.find(a => a.id === id);

    /* ================================================================
       ESTADO
    ================================================================ */
    const SYS_KEY = 'dc_system_settings';
    const ASST_KEY = 'dc_assistant_settings';
    const USERS_KEY = 'dc_users';
    const ACTIVE_USER_KEY = 'dc_active_user';

    const defaultSystem = {
      deviceName: 'DC', language: 'pt', theme: 'dark',
      brightness: 80, volume: 60,
      wifiOn: true, bluetoothOn: false, airplaneOn: false,
      dndOn: false, flashOn: false, rotationOn: true,
      lockOn: false, showStats: true,
      wallpaper: { type: 'aurora', value: '' },
      pin: '',
      wakeWordOn: false,
      quickTileOrder: ['wifiOn','bluetoothOn','airplaneOn','dndOn','flashOn','rotationOn'],
      quickTileHidden: [],
    };
    const defaultAssistant = {
      name: 'DC', language: 'pt', voice: 'feminina', personality: 'amigável',
      notifications: 'alto', allowCommands: true, integrations: ['spotify','agenda'],
      model: 'mock', privacy: true,
      gatewayUrl: 'http://localhost:4000', gatewayOn: false,
      sessionId: 'dc-' + Math.random().toString(36).slice(2, 10),
    };

    const system = { ...defaultSystem, ...(JSON.parse(localStorage.getItem(SYS_KEY) || '{}')) };
    const assistant = { ...defaultAssistant, ...(JSON.parse(localStorage.getItem(ASST_KEY) || '{}')) };
    const saveSystem  = () => localStorage.setItem(SYS_KEY, JSON.stringify(system));
    const saveAssistant = () => localStorage.setItem(ASST_KEY, JSON.stringify(assistant));

    /* ================================================================
       CONTAS E PERFIS — multi-utilizador com PIN e definições
    ================================================================ */
    const defaultUsers = [{ id: 'owner', name: 'Proprietário', pin: '', role: 'admin', color: '#a78bfa', icon: 'fa-solid fa-user-shield' }];
    const users = JSON.parse(localStorage.getItem(USERS_KEY) || 'null') || defaultUsers;
    let activeUserId = localStorage.getItem(ACTIVE_USER_KEY) || users[0].id;
    const saveUsers = () => localStorage.setItem(USERS_KEY, JSON.stringify(users));
    const saveActiveUser = () => localStorage.setItem(ACTIVE_USER_KEY, activeUserId);
    const activeUser = () => users.find(u => u.id === activeUserId) || users[0];
    const userById = id => users.find(u => u.id === id);

    function switchUser(userId) {
      const u = userById(userId);
      if (!u) return;
      if (u.pin) {
        showLockScreen('unlock', { hint: `PIN de ${u.name}`, allowCancel: true, onUnlock: () => {
          activeUserId = userId; saveActiveUser();
          toast({ type:'ok', title:'Perfil trocado', message: u.name });
          if (currentApp === 'definicoes') renderSetCat();
        }});
      } else {
        activeUserId = userId; saveActiveUser();
        toast({ type:'ok', title:'Perfil trocado', message: u.name });
        if (currentApp === 'definicoes') renderSetCat();
      }
    }

    function addUser() {
      showModal({ type:'info', title:'Novo utilizador', message:'', actions:[{label:'Cancelar',style:'ghost'}] });
      const msg = document.getElementById('modal-msg');

    function showModal({ type='info', title='', message='', actions=[{label:'OK', style:'', onClick:closeModal}] }) {
      const bd = document.getElementById('modal-backdrop');
      const m  = document.getElementById('modal');
      const ic = document.getElementById('modal-icon');
      m.className = 'modal ' + (type === 'error' ? 'err' : type === 'warn' ? 'warn' : type === 'ok' ? 'ok' : '');
      const iconMap = { info:'fa-circle-info', ok:'fa-circle-check', warn:'fa-triangle-exclamation', error:'fa-circle-exclamation' };
      ic.innerHTML = `<i class="fa-solid ${iconMap[type] || iconMap.info}"></i>`;
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-msg').textContent = message;
      const actionsEl = document.getElementById('modal-actions');
      actionsEl.innerHTML = '';
      actions.forEach(a => {
        const b = document.createElement('button');
        b.className = 'btn ' + (a.style || '');
        b.textContent = a.label;
        b.onclick = () => { closeModal(); a.onClick && a.onClick(); };
        actionsEl.appendChild(b);
      });
      bd.classList.add('open');
    }
    function closeModal() { document.getElementById('modal-backdrop').classList.remove('open'); }

    /* ================================================================

    ================================================================ */
    function toast({ type='info', title='', message='', duration=3200 }) {
      const stack = document.getElementById('toast-stack');
      const el = document.createElement('div');
      const iconMap = { info:'fa-circle-info', ok:'fa-check', warn:'fa-triangle-exclamation', error:'fa-xmark' };
      el.className = 'toast ' + (type === 'error' ? 'err' : type === 'ok' ? 'ok' : type === 'warn' ? 'warn' : '');
      el.innerHTML = `
        <div class="toast-ic"><i class="fa-solid ${iconMap[type] || iconMap.info}"></i></div>
        <div class="toast-txt">
          <strong>${title}</strong>
          ${message ? `<small>${message}</small>` : ''}
        </div>`;
      stack.appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      setTimeout(() => {
        el.classList.remove('show');
        setTimeout(() => el.remove(), 320);
      }, duration);
    }

      { id: 'wifiOn',     label: 'Wi-Fi',       icon: 'fa-solid fa-wifi',            sub: () => system.wifiOn ? 'Ligado' : 'Desligado' },
      { id: 'bluetoothOn',label: 'Bluetooth',   icon: 'fa-brands fa-bluetooth-b',    sub: () => system.bluetoothOn ? 'Ligado' : 'Desligado' },
      { id: 'airplaneOn', label: 'Modo avião',  icon: 'fa-solid fa-plane',           sub: () => system.airplaneOn ? 'Ativo' : 'Inativo' },

      { id: 'flashOn',    label: 'Lanterna',    icon: 'fa-solid fa-bolt',            sub: () => system.flashOn ? 'Ligada' : 'Desligada' },
      { id: 'rotationOn', label: 'Rotação',     icon: 'fa-solid fa-arrows-rotate',   sub: () => system.rotationOn ? 'Auto' : 'Bloqueada' },

    function renderQuickTiles() {
      const wrap = document.getElementById('qp-tiles');
      const hiddenSection = document.getElementById('qp-hidden-section');
      const hiddenList = document.getElementById('qp-hidden-list');
      wrap.innerHTML = '';

      // Garantir que todos os tiles existem na ordem (adiciona novos no fim)
      const knownIds = QUICK_TILES.map(t => t.id);
      system.quickTileOrder = system.quickTileOrder.filter(id => knownIds.includes(id));
      knownIds.forEach(id => { if (!system.quickTileOrder.includes(id)) system.quickTileOrder.push(id); });
      system.quickTileHidden = (system.quickTileHidden || []).filter(id => knownIds.includes(id));

      const visibleIds = system.quickTileOrder.filter(id => !system.quickTileHidden.includes(id));
      const hiddenIds  = system.quickTileOrder.filter(id =>  system.quickTileHidden.includes(id));

      visibleIds.forEach(id => {
        const tile = QUICK_TILES.find(t => t.id === id);
        if (!tile) return;
        const on = !!system[tile.id];
        const el = document.createElement('div');
        el.className = 'qp-tile' + (on ? ' on' : '');
        el.dataset.tileId = tile.id;
        el.draggable = false;
        el.innerHTML = `
          <div class="qp-ic"><i class="${tile.icon}"></i></div>
          <div class="qp-txt"><strong>${tile.label}</strong><small>${tile.sub()}</small></div>
          <span class="qp-hide" title="Ocultar"><i class="fa-solid fa-eye-slash"></i></span>`;
        el.onclick = (e) => {
          const panel = document.getElementById('quick-panel');
          if (panel.classList.contains('editing')) {
            if (e.target.closest('.qp-hide')) {
              if (!system.quickTileHidden.includes(tile.id)) system.quickTileHidden.push(tile.id);
              saveSystem(); renderQuickTiles();
            }
            return;
          }
          // Toggle normal
          if (tile.id === 'airplaneOn' && !system.airplaneOn) {
            system.airplaneOn = true; system.wifiOn = false; system.bluetoothOn = false;
          } else if (tile.id === 'airplaneOn' && system.airplaneOn) {
            system.airplaneOn = false;
          } else {
            if (system.airplaneOn && (tile.id === 'wifiOn' || tile.id === 'bluetoothOn')) {
              toast({ type:'warn', title:'Modo avião ativo', message:'Desliga o modo avião primeiro.' });
              return;
            }
            system[tile.id] = !system[tile.id];
          }
          saveSystem(); renderQuickTiles(); updateStatusIcons();
        };
        attachTileDrag(el);
        wrap.appendChild(el);
      });

      // Seccao de ocultos
      hiddenList.innerHTML = '';
      if (hiddenIds.length) {
        hiddenSection.classList.add('has-hidden');
        hiddenIds.forEach(id => {
          const tile = QUICK_TILES.find(t => t.id === id);
          if (!tile) return;
          const chip = document.createElement('span');
          chip.className = 'qp-hidden-chip';
          chip.innerHTML = `<i class="${tile.icon}"></i> ${tile.label}`;
          chip.onclick = () => {
            system.quickTileHidden = system.quickTileHidden.filter(x => x !== id);
            saveSystem(); renderQuickTiles();
          };
          hiddenList.appendChild(chip);
        });
      } else {
        hiddenSection.classList.remove('has-hidden');
      }
    }

    /* Drag & drop dos tiles do painel rapido */
    let dragSrcEl = null;
    function attachTileDrag(el) {
      el.addEventListener('mousedown', () => {
        if (!document.getElementById('quick-panel').classList.contains('editing')) return;
        el.draggable = true;
      });
      el.addEventListener('touchstart', () => {
        if (!document.getElementById('quick-panel').classList.contains('editing')) return;
        el.draggable = true;
      }, { passive: true });
      el.addEventListener('dragstart', (e) => {
        if (!document.getElementById('quick-panel').classList.contains('editing')) { e.preventDefault(); return; }
        dragSrcEl = el; el.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        try { e.dataTransfer.setData('text/plain', el.dataset.tileId); } catch(_) {}
      });
      el.addEventListener('dragover', (e) => {
        if (!dragSrcEl || dragSrcEl === el) return;
        e.preventDefault(); e.dataTransfer.dropEffect = 'move';
        el.classList.add('drag-over');
      });
      el.addEventListener('dragleave', () => el.classList.remove('drag-over'));
      el.addEventListener('drop', (e) => {
        e.preventDefault(); el.classList.remove('drag-over');
        if (!dragSrcEl || dragSrcEl === el) return;
        const srcId = dragSrcEl.dataset.tileId;
        const dstId = el.dataset.tileId;
        const order = system.quickTileOrder.slice();
        const si = order.indexOf(srcId); order.splice(si, 1);
        const di = order.indexOf(dstId); order.splice(di, 0, srcId);
        system.quickTileOrder = order;
        saveSystem(); renderQuickTiles();
      });
      el.addEventListener('dragend', () => {
        el.classList.remove('dragging'); el.draggable = false; dragSrcEl = null;
      });
    }

    // Gesto — arrastar para baixo desde a barra de estado
    (function setupSwipe() {
      const sb = document.getElementById('status-bar');
      const panel = document.getElementById('quick-panel');
      let startY = null, dragging = false;

      const onStart = (y) => { startY = y; dragging = true; };
      const onMove = (y) => {
        if (!dragging || startY === null) return;
        const dy = y - startY;
        if (dy > 30) { toggleQuickPanel(true); dragging = false; }
      };
      const onEnd = () => { dragging = false; startY = null; };

      sb.addEventListener('mousedown', e => onStart(e.clientY));
      window.addEventListener('mousemove', e => onMove(e.clientY));
      window.addEventListener('mouseup', onEnd);
      sb.addEventListener('touchstart', e => onStart(e.touches[0].clientY), { passive: true });
      window.addEventListener('touchmove', e => onMove(e.touches[0].clientY), { passive: true });
      window.addEventListener('touchend', onEnd);

      // Clicar simples na barra também abre
      sb.addEventListener('click', (e) => {
        if (e.target.closest('.sb-hint') || e.target === sb || e.target.closest('.sb-left') || e.target.closest('.sb-right')) {
          toggleQuickPanel();
        }
      });

      // Arrastar o painel para cima para fechar
      let pStartY = null;
      panel.addEventListener('mousedown', e => {
        pStartY = e.target.closest('.qp-drag') ? e.clientY : null;
      });
      window.addEventListener('mouseup', e => {
        if (pStartY !== null && (pStartY - e.clientY) > 40) toggleQuickPanel(false);
        pStartY = null;
      });
      panel.addEventListener('touchstart', e => {
        pStartY = e.target.closest('.qp-drag') ? e.touches[0].clientY : null;
      }, { passive: true });
      window.addEventListener('touchend', e => {
        if (pStartY !== null && e.changedTouches[0] && (pStartY - e.changedTouches[0].clientY) > 40) toggleQuickPanel(false);
        pStartY = null;
      });
    })();

    async function callGateway(text) {
      const url = (assistant.gatewayUrl || '').replace(/\/$/, '');
      if (!url) throw new Error('Gateway URL nao definido');
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 20000);
      try {
        const res = await fetch(`${url}/api/assistant/message`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ sessionId: assistant.sessionId, text }),
          signal: controller.signal,
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        return typeof data === 'string' ? data : (data.reply?.text || data.text || data.message || JSON.stringify(data));
      } finally { clearTimeout(timeoutId); }
    }

    async function checkGatewayHealth() {
      const url = (assistant.gatewayUrl || '').replace(/\/$/, '');
      if (!url) return { ok: false, err: 'URL vazio' };
      try {
        const controller = new AbortController();
        const t = setTimeout(() => controller.abort(), 5000);
        const res = await fetch(`${url}/health`, { signal: controller.signal });
        clearTimeout(t);
        if (!res.ok) return { ok: false, err: `HTTP ${res.status}` };
        const data = await res.json().catch(() => ({}));
        return { ok: true, data };
      } catch (err) { return { ok: false, err: (err && err.message) || 'erro' }; }
    }

    function updateGatewayStatusUI(state) {
      const badge = document.getElementById('gw-status-badge');
      if (!badge) return;
      badge.classList.remove('ok', 'err');
      if (state === 'ok') { badge.classList.add('ok'); badge.querySelector('.gw-txt').textContent = 'Gateway ligado'; }
      else if (state === 'err') { badge.classList.add('err'); badge.querySelector('.gw-txt').textContent = 'Gateway indisponível'; }
      else { badge.querySelector('.gw-txt').textContent = 'Gateway desligado'; }
    }

    // Respostas simuladas por palavra-chave (modo Mock / sem Gateway).
    // Cada entrada tem uma lista de palavras-chave a procurar no texto do utilizador.
    const MOCK_INTENTS = [
      { keys: ['estado do sistema', 'estado geral', 'como está o sistema'],
        reply: 'Tudo operacional. Rede ligada, temperatura 23.4 °C, humidade 61%, 1 alarme ativo.' },
      { keys: ['alarme', 'alarmes'],
        reply: '1 alarme ativo (prioridade alta): temperatura elevada no controlo (28.1 °C). Sugestão: verificar ventilação.' },
      { keys: ['evento', 'eventos', 'agenda', 'calendário', 'calendario'],
        reply: 'Hoje: 3 eventos na agenda — 09:00 Reunião de equipa, 11:30 Verificação de rotina, 15:00 Manutenção preventiva.' },
      { keys: ['sugest'],
        reply: 'Sugiro baixar o setpoint do controlo em 1 °C e verificar a ventilação para reduzir a temperatura.' },
      { keys: ['música', 'musica', 'spotify', 'tocar'],
        reply: 'A tocar "Blinding Lights" de The Weeknd. Diz "próxima" para saltar a faixa.' },
      { keys: ['temperatura'],
        reply: 'Temperatura atual: 23.4 °C (ambiente) / 28.1 °C (controlo).' },
      { keys: ['humidade'],
        reply: 'Humidade atual: 61%.' },
      { keys: ['olá', 'ola', 'bom dia', 'boa tarde', 'boa noite', 'oi'],
        reply: `Olá! Sou a ${assistant.name}. Posso dar-te o estado do sistema, alarmes, agenda ou sugestões — é só perguntar.` },
      { keys: ['obrigad'],
        reply: 'De nada! Estou por aqui se precisares de mais alguma coisa.' },
      { keys: ['ajuda', 'o que fazes', 'o que consegues fazer'],
        reply: 'Posso informar-te sobre o estado do sistema, analisar alarmes, resumir a agenda e sugerir ajustes. Experimenta um dos atalhos acima.' },
    ];
    function mockReply(text) {
      const t = text.toLowerCase();
      const hit = MOCK_INTENTS.find(intent => intent.keys.some(k => t.includes(k)));
      if (hit) return hit.reply;
      return `Recebido: "${text}". (Resposta simulada — ativa o Gateway nas Definições do assistente para respostas reais.)`;
    }

    async function assistantSend() {
      if (assistantBusy) return;
      const input = document.getElementById('chat-text');
      const text = input.value.trim(); if (!text) return;
      input.value = '';

      chatHistory.push({ role: 'user', text: escapeHtml(text) });
      chatHistory.push({ role: 'bot', text: '', pending: true });
      renderChatLog();

      assistantBusy = true;
      const sendBtn = document.getElementById('chat-send-btn');
      if (sendBtn) sendBtn.disabled = true;
      input.disabled = true;

      let finalMsg;
      if (assistant.gatewayOn && assistant.gatewayUrl) {
        try {
          const reply = await callGateway(text);
          finalMsg = { role: 'bot', text: reply };
          updateGatewayStatusUI('ok');
        } catch (err) {
          finalMsg = { role: 'bot', err: true,
            text: `<i>Falha ao contactar o Gateway (${escapeHtml((err && err.message) || 'erro')}). A usar resposta simulada.</i><br>${mockReply(text)}` };
          updateGatewayStatusUI('err');
        }
      } else {
        finalMsg = { role: 'bot', text: mockReply(text) };
      }

      const pendingIdx = chatHistory.findIndex(m => m.pending);
      if (pendingIdx !== -1) chatHistory[pendingIdx] = finalMsg; else chatHistory.push(finalMsg);
      renderChatLog();

      assistantBusy = false;
      if (sendBtn) sendBtn.disabled = false;
      input.disabled = false;
      input.focus();
    }
    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function testGatewayNow() {
      const btn = document.getElementById('gw-test-btn');
      if (btn) { btn.disabled = true; btn.textContent = 'A testar...'; }
      const result = await checkGatewayHealth();
      if (result.ok) {
        updateGatewayStatusUI('ok');
        toast({ type:'ok', title:'Gateway ligado', message: (result.data && result.data.service) || 'dc-gateway' });
      } else {
        updateGatewayStatusUI('err');
        toast({ type:'error', title:'Gateway indisponível', message: result.err });
      }
      if (btn) { btn.disabled = false; btn.textContent = 'Testar ligação'; }
    }

    let storeCatalog = STORE_FALLBACK;

    function getStoreManifestUrl() {

    async function fetchStoreManifest() {
      const url = getStoreManifestUrl();
      if (!url) { storeCatalog = STORE_FALLBACK; return { ok: true, source: 'local', count: storeCatalog.length }; }
      storeLoading = true;
      try {
        const controller = new AbortController();
        const t = setTimeout(() => controller.abort(), 10000);
        const res = await fetch(url, { signal: controller.signal });
        clearTimeout(t);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (!Array.isArray(data) && Array.isArray(data.apps)) data = data.apps;
        if (!Array.isArray(data)) throw new Error('Formato inválido');
        const valid = data.filter(a => a.id && a.name);
        if (!valid.length) throw new Error('Manifest vazio');
        storeCatalog = valid.map(a => ({
          id: a.id, name: a.name,
          icon: a.icon || 'fa-solid fa-cube',
          color: a.color || '#a78bfa',
          cat: a.cat || 'Outros',
          desc: a.desc || '',
          version: a.version || '1.0',
          size: a.size || '—',
        }));
        return { ok: true, source: 'remote', count: storeCatalog.length };
      } catch (err) {
        storeCatalog = STORE_FALLBACK;
        return { ok: false, err: (err && err.message) || 'erro', source: 'fallback' };
      } finally {
        storeLoading = false;
      }
    }

    function renderLoja() {
      const body = document.getElementById('app-body');
      const cats = ['Todas', ...new Set(storeCatalog.map(c => c.cat))];
      const manifestUrl = getStoreManifestUrl();
      body.innerHTML = `
        <div class="card" style="margin-top:8px">
          <div class="card-title"><strong>Fonte da loja</strong><small>${manifestUrl ? 'Manifest remoto' : 'Catálogo local'}</small></div>
          <div class="row"><div class="row-label"><strong>URL do manifest</strong><small>JSON com lista de apps disponíveis</small></div></div>
          <div class="row" style="gap:6px">
            <input class="dc-input" id="store-manifest-url" placeholder="https://.../manifest.json" style="flex:1;max-width:none" value="${manifestUrl}">
            <button class="btn sm" onclick="updateStoreManifest()">Guardar</button>
            <button class="btn ghost sm" onclick="refreshStore()"><i class="fa-solid fa-rotate-right"></i> Atualizar</button>
          </div>
          <div class="row"><span class="muted">${storeCatalog.length} apps disponíveis${storeLoading?' · a carregar...':''}</span></div>
        </div>
        <div class="chips">${cats.map(c => `<span class="chip ${c===storeCat?'active':''}" onclick="storeCat='${c}';renderLoja()">${c}</span>`).join('')}</div>
        <div id="store-list" style="display:flex;flex-direction:column;gap:10px"></div>`;
      const list = document.getElementById('store-list');
      const filtered = storeCatalog.filter(c => storeCat === 'Todas' || c.cat === storeCat);
      if (!filtered.length) {
        list.innerHTML = '<div class="card muted" style="text-align:center">Nenhuma app encontrada.</div>';
        return;
      }
      filtered.forEach(app => {
        const installed = storeInstalled.has(app.id);
        const card = document.createElement('div');
        card.className = 'card store-item';
        card.innerHTML = `
          <div class="app-icon" style="color:${app.color}"><i class="${app.icon}"></i></div>
          <div class="row-label" style="flex:1">
            <strong>${app.name}</strong>
            <small class="store-meta">${app.cat} · v${app.version} · ${app.size}</small>
            <small class="muted">${app.desc}</small>
          </div>
          <button class="btn sm ${installed ? 'ghost' : ''}" onclick="toggleStoreApp('${app.id}', this)">${installed ? 'Remover' : 'Instalar'}</button>`;
        list.appendChild(card);
      });
    }

    async function updateStoreManifest() {
      const input = document.getElementById('store-manifest-url');
      const url = input.value.trim();
      localStorage.setItem(STORE_MANIFEST_KEY, url);
      if (url) {
        toast({ type:'info', title:'A carregar manifest...', message: url });
        const r = await fetchStoreManifest();
        if (r.ok) toast({ type:'ok', title:'Manifest carregado', message: `${r.count} apps de ${r.source}` });
        else toast({ type:'warn', title:'Manifest indisponível', message: `${r.err} — a usar catálogo local` });
      } else {
        storeCatalog = STORE_FALLBACK;
        toast({ type:'ok', title:'A usar catálogo local' });
      }
      renderLoja();
    }

    async function refreshStore() {
      const r = await fetchStoreManifest();
      if (r.ok && r.source === 'remote') toast({ type:'ok', title:'Loja atualizada', message: `${r.count} apps` });
      else if (!getStoreManifestUrl()) toast({ type:'info', title:'Catálogo local', message: 'Define um URL de manifest para loja remota' });
      else toast({ type:'warn', title:'Sem ligação', message: 'A usar catálogo local' });
      renderLoja();
    }

    function toggleStoreApp(id, btn) {
      const app = storeCatalog.find(a => a.id === id);
      if (storeInstalled.has(id)) {
        showModal({ type:'warn', title:'Remover aplicação?', message:`Vais remover "${app.name}" do sistema.`,
          actions: [ { label:'Cancelar', style:'ghost' },
            { label:'Remover', style:'err', onClick: () => {
                storeInstalled.delete(id); saveStore(); renderLoja(); renderLauncher();
                toast({ type:'ok', title:'Removida', message:app.name });
            }} ]});
      } else {
        storeInstalled.add(id); saveStore(); 
        if (btn) { btn.textContent = 'Remover'; btn.classList.add('ghost'); }
        const funcional = !!STORE_RENDERERS[id];
        toast({ type:'ok', title:'Instalada', message:`${app.name}${funcional ? ' — pronta a usar' : ' — em breve'}` });
        renderLauncher();
      }
    }

        </div>
        <div class="card"><div class="card-title"><strong>Ao longo do dia</strong></div>
          <div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:4px">
            ${hours.map(h=>`<div style="flex:none;text-align:center;min-width:52px;padding:8px 4px;background:var(--bg-elev);border:1px solid var(--stroke);border-radius:12px">

    /* ================= FICHEIROS ================= */
    const fileTree = {
      Documentos: [
        {n:'relatorio_2024.pdf', s:'420 KB', ic:'fa-file-pdf', c:'#f87171'},
        {n:'notas_reuniao.txt', s:'8 KB', ic:'fa-file-lines', c:'#94a3b8'},

    let ficheirosFolder = null;

    function wallpaperLabel() {
      const wp = system.wallpaper || { type: 'aurora' };
      if (wp.type === 'aurora') return 'Aurora animada';
      if (wp.type === 'image')  return 'Imagem personalizada';
      const preset = WALLPAPER_PRESETS.find(p => p.id === wp.id);
      return preset ? preset.label : 'Cor sólida';
    }

    function applyWallpaper() {
      const wp = system.wallpaper || { type: 'aurora' };
      const dev   = document.getElementById('device');
      const solid = document.getElementById('wallpaper-solid');
      const img   = document.getElementById('wallpaper-image');
      dev.setAttribute('data-wallpaper', wp.type);
      if (wp.type === 'solid') {
        solid.style.display = 'block';
        solid.style.background = wp.value || '#05030c';
        img.style.display = 'none';
      } else if (wp.type === 'image') {
        img.style.display = 'block';
        img.style.backgroundImage = `url("${wp.value}")`;
        solid.style.display = 'none';
      } else {
        solid.style.display = 'none';
        img.style.display = 'none';
      }
      const lbl = document.getElementById('wp-current-label');
      if (lbl) lbl.textContent = wallpaperLabel();
    }

    function setWallpaper(wp) {
      system.wallpaper = wp; saveSystem(); applyWallpaper();
      toast({ type:'ok', title:'Papel de parede atualizado', message: wallpaperLabel() });

        return `<div class="wp-swatch${selected}" ${style} data-id="${p.id}"><span class="wp-label">${p.label}</span></div>`;
      }).join('');

      showModal({
        type:'info', title:'Papel de parede', message:'',
