<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>DC — Sistema Operativo</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* ==============================================================
       DC OS — Tema Escuro Moderno (Glassmorphism + Aurora)
    ============================================================== */
    :root {
      --bg-void: #05030c;
      --bg-deep: #0a0716;
      --bg-elev: rgba(255, 255, 255, 0.045);
      --bg-elev-2: rgba(255, 255, 255, 0.075);
      --bg-elev-hover: rgba(255, 255, 255, 0.11);
      --stroke: rgba(255, 255, 255, 0.08);
      --stroke-strong: rgba(255, 255, 255, 0.16);

      --accent: #a78bfa;
      --accent-2: #7c3aed;
      --accent-cyan: #22d3ee;
      --accent-pink: #f472b6;
      --glow: rgba(139, 92, 246, 0.55);

      --text: #f5f3ff;
      --text-dim: #b4b0c8;
      --text-mute: #7a758f;

      --ok: #34d399;
      --warn: #fbbf24;
      --err: #f87171;

      --r-sm: 10px;
      --r-md: 14px;
      --r-lg: 20px;
      --r-xl: 28px;

      --shadow-1: 0 10px 30px rgba(0,0,0,0.45);
      --shadow-glow: 0 0 40px rgba(139, 92, 246, 0.25);

      --fs-base: clamp(11px, 2.6vw, 14px);
      --dur: 240ms;
      --ease: cubic-bezier(.2, .8, .2, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0;
        font-family: 'Sora', 'Segoe UI', system-ui, sans-serif;
        -webkit-tap-highlight-color: transparent; user-select: none; }
    ::selection { background: var(--accent-2); color: #fff; }

    html, body { height: 100%; }

    body {
      background: #020106;
      display: flex; justify-content: center; align-items: center;
      min-height: 100dvh; color: var(--text);
      font-size: var(--fs-base); overflow: hidden;
    }

    /* ---------- Enclosure que simula o ecrã do dispositivo ---------- */
    .device {
      width: min(800px, 100vw);
      aspect-ratio: 800 / 480;
      max-height: 100dvh;
      background: var(--bg-void);
      border-radius: clamp(0px, 2vw, 20px);
      border: 1px solid var(--stroke);
      box-shadow: var(--shadow-1), var(--shadow-glow);
      position: relative; overflow: hidden; isolation: isolate;
    }

    /* Aurora background (aurora glows atrás de tudo) */
    .device::before, .device::after {
      content: ""; position: absolute; inset: -30%; z-index: 0;
      background:
        radial-gradient(closest-side at 20% 20%, rgba(124, 58, 237, 0.55), transparent 60%),
        radial-gradient(closest-side at 80% 30%, rgba(34, 211, 238, 0.28), transparent 65%),
        radial-gradient(closest-side at 50% 90%, rgba(244, 114, 182, 0.28), transparent 70%);
      filter: blur(60px) saturate(140%);
      opacity: .55; pointer-events: none;
      animation: aurora 22s var(--ease) infinite alternate;
    }
    .device::after {
      background:
        radial-gradient(closest-side at 70% 70%, rgba(167, 139, 250, 0.35), transparent 65%),
        radial-gradient(closest-side at 15% 80%, rgba(59, 130, 246, 0.28), transparent 70%);
      animation-duration: 30s; animation-direction: alternate-reverse; opacity: .45;
    }
    @keyframes aurora {
      0%   { transform: translate(0,0) scale(1); }
      100% { transform: translate(4%,-3%) scale(1.08); }
    }

    /* Grain / noise overlay */
    .device .noise {
      position: absolute; inset: 0; z-index: 1; pointer-events: none; opacity: .04;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.6'/></svg>");
      mix-blend-mode: overlay;
    }

    @media (max-width: 420px), (max-height: 320px) {
      .device { aspect-ratio: auto; width: 100vw; height: 100dvh; border-radius: 0; border: none; }
    }

    /* ==============================================================
       BARRA DE ESTADO (fixa, em todas as páginas)
    ============================================================== */
    .status-bar {
      position: absolute; top: 0; left: 0; right: 0;
      height: 30px; z-index: 30;
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 14px;
      color: var(--text);
      font-size: 11px; font-weight: 500;
      background: linear-gradient(180deg, rgba(5,3,12,0.75) 0%, rgba(5,3,12,0) 100%);
      backdrop-filter: blur(14px) saturate(140%);
      -webkit-backdrop-filter: blur(14px) saturate(140%);
      cursor: grab;
    }
    .status-bar:active { cursor: grabbing; }
    .status-bar .sb-left { display: flex; align-items: center; gap: 8px; }
    .status-bar .sb-left .dot { width: 6px; height: 6px; border-radius: 999px; background: var(--accent); box-shadow: 0 0 8px var(--glow); }
    .status-bar .sb-right { display: flex; align-items: center; gap: 10px; }
    .status-bar .sb-right i { font-size: 11px; color: var(--text-dim); }
    .status-bar .sb-right i.on { color: var(--accent); text-shadow: 0 0 8px var(--glow); }
    .status-bar .sb-battery { display: flex; align-items: center; gap: 4px; }
    .status-bar .sb-hint {
      position: absolute; left: 50%; top: 22px; transform: translateX(-50%);
      width: 44px; height: 3px; border-radius: 999px;
      background: rgba(255,255,255,0.22);
      transition: width var(--dur) var(--ease), background var(--dur) var(--ease);
    }
    .status-bar:hover .sb-hint { width: 70px; background: rgba(255,255,255,0.4); }

    /* ==============================================================
       PAINEL DE CONTROLO RÁPIDO (arrastar da barra de estado)
    ============================================================== */
    .quick-panel {
      position: absolute; top: 0; left: 0; right: 0;
      z-index: 40;
      background: rgba(10, 7, 22, 0.82);
      backdrop-filter: blur(24px) saturate(160%);
      -webkit-backdrop-filter: blur(24px) saturate(160%);
      border-bottom: 1px solid var(--stroke);
      transform: translateY(-105%);
      transition: transform 380ms var(--ease);
      padding: 40px 18px 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.55);
    }
    .quick-panel.open { transform: translateY(0); }
    .quick-panel .qp-drag {
      position: absolute; left: 50%; bottom: 6px; transform: translateX(-50%);
      width: 60px; height: 4px; border-radius: 999px;
      background: rgba(255,255,255,0.35); cursor: grab;
    }
    .quick-panel .qp-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 14px;
    }
    .quick-panel .qp-header .qp-title { display: flex; flex-direction: column; }
    .quick-panel .qp-header .qp-title strong { font-size: 13px; font-weight: 600; }
    .quick-panel .qp-header .qp-title small { color: var(--text-mute); font-size: 10px; }
    .qp-close {
      background: var(--bg-elev); border: 1px solid var(--stroke); color: var(--text);
      width: 28px; height: 28px; border-radius: 999px; cursor: pointer;
    }

    .qp-tiles {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px;
      margin-bottom: 14px;
    }
    .qp-tile {
      background: var(--bg-elev); border: 1px solid var(--stroke);
      border-radius: var(--r-md); padding: 10px;
      display: flex; align-items: center; gap: 10px; cursor: pointer;
      transition: transform var(--dur) var(--ease), background var(--dur) var(--ease), border-color var(--dur) var(--ease);
    }
    .qp-tile:hover { background: var(--bg-elev-hover); }
    .qp-tile:active { transform: scale(0.96); }
    .qp-tile.on {
      background: linear-gradient(135deg, rgba(167,139,250,0.28), rgba(124,58,237,0.15));
      border-color: rgba(167,139,250,0.6);
      box-shadow: 0 0 24px rgba(139,92,246,0.25);
    }
    .qp-tile .qp-ic {
      width: 34px; height: 34px; border-radius: 10px;
      background: rgba(255,255,255,0.05); display: flex; align-items: center; justify-content: center;
      font-size: 14px; color: var(--text-dim); flex-shrink: 0;
    }
    .qp-tile.on .qp-ic { background: var(--accent); color: #fff; box-shadow: 0 0 12px var(--glow); }
    .qp-tile .qp-txt { display: flex; flex-direction: column; min-width: 0; }
    .qp-tile .qp-txt strong { font-size: 11px; font-weight: 600; }
    .qp-tile .qp-txt small { color: var(--text-mute); font-size: 9px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .qp-slider {
      background: var(--bg-elev); border: 1px solid var(--stroke);
      border-radius: var(--r-md); padding: 10px 14px;
      display: flex; align-items: center; gap: 12px; margin-bottom: 8px;
    }
    .qp-slider i { color: var(--text-dim); width: 16px; text-align: center; }
    .qp-slider .qp-val { color: var(--text-dim); font-size: 10px; min-width: 30px; text-align: right; }
    .qp-slider input[type="range"] { flex: 1; }

    /* ==============================================================
       ECRÃS
    ============================================================== */
    .screens { position: absolute; inset: 0; z-index: 5; }
    .screen {
      display: none; position: absolute; inset: 0;
      padding: 40px 18px 14px; overflow: hidden;
      animation: screenIn 320ms var(--ease);
    }
    .screen.active { display: flex; flex-direction: column; }
    @keyframes screenIn {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to   { opacity: 1; transform: none; }
    }

    /* ---------- Launcher ---------- */
    #screen-launcher { justify-content: flex-start; }
    .launcher-head { text-align: left; margin: 4px 2px 14px; display: flex; align-items: baseline; justify-content: space-between; }
    .launcher-head h1 {
      font-size: clamp(18px, 4.5vw, 28px); font-weight: 300; letter-spacing: -0.02em;
    }
    .launcher-head h1 span {
      font-weight: 700;
      background: linear-gradient(120deg, var(--accent) 0%, var(--accent-cyan) 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .launcher-head p { color: var(--text-mute); font-size: 11px; margin-top: 2px; }
    .launcher-date { text-align: right; }
    .launcher-date b { font-size: 22px; font-weight: 500; display: block; }
    .launcher-date small { color: var(--text-mute); font-size: 10px; text-transform: capitalize; }

    .launcher-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(10px, 2.4vw, 18px);
      align-content: start;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 2px 2px 8px;
    }
    @media (max-width: 420px), (max-height: 320px) {
      .launcher-grid { grid-template-columns: repeat(3, 1fr); }
    }

    .app-item {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
      cursor: pointer; text-align: center; padding: 6px 4px; border-radius: var(--r-lg);
      animation: itemIn 420ms var(--ease) both;
    }
    @keyframes itemIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .app-item:active { transform: scale(0.94); }

    .app-icon {
      width: clamp(46px, 12vw, 66px); height: clamp(46px, 12vw, 66px);
      border-radius: 20px;
      background: var(--bg-elev);
      border: 1px solid var(--stroke);
      backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(18px, 5vw, 26px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
      transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
      position: relative; overflow: hidden;
    }
    .app-icon::after {
      content: ""; position: absolute; inset: 0;
      background: radial-gradient(120% 100% at 50% 0%, rgba(255,255,255,0.08), transparent 60%);
      pointer-events: none;
    }
    .app-item:hover .app-icon { transform: translateY(-2px); box-shadow: 0 14px 30px rgba(0,0,0,0.5), 0 0 22px var(--glow); }
    .app-item span { font-size: 11px; font-weight: 500; color: var(--text); }
    .app-item small { color: var(--text-mute); font-size: 9px; line-height: 1.2; }

    /* ---------- Cabeçalho de app ---------- */
    .app-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .back-btn {
      background: var(--bg-elev); border: 1px solid var(--stroke);
      color: var(--text); width: 34px; height: 34px; border-radius: 12px;
      cursor: pointer; font-size: 13px; flex-shrink: 0;
      transition: background var(--dur) var(--ease), transform var(--dur) var(--ease);
    }
    .back-btn:hover { background: var(--bg-elev-hover); }
    .back-btn:active { transform: scale(0.9); }
    .app-header h2 { font-size: clamp(15px, 3.8vw, 20px); flex: 1; font-weight: 600; letter-spacing: -0.01em; }
    .app-header .app-icon-mini {
      width: 34px; height: 34px; border-radius: 12px;
      background: var(--bg-elev); border: 1px solid var(--stroke);
      display: flex; align-items: center; justify-content: center; font-size: 15px;
    }
    .app-body { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; padding-right: 2px; }
    .app-body::-webkit-scrollbar { width: 4px; }
    .app-body::-webkit-scrollbar-thumb { background: var(--stroke-strong); border-radius: 999px; }
    .launcher-grid::-webkit-scrollbar { width: 4px; }
    .launcher-grid::-webkit-scrollbar-thumb { background: var(--stroke-strong); border-radius: 999px; }

    /* ---------- Cartões ---------- */
    .card {
      background: var(--bg-elev);
      border: 1px solid var(--stroke);
      backdrop-filter: blur(12px) saturate(140%);
      border-radius: var(--r-lg);
      padding: 14px 16px;
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05);
    }
    .card-title { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .card-title strong { font-size: 13px; font-weight: 600; }
    .card-title small { color: var(--text-mute); font-size: 10px; }

    .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .row + .row { margin-top: 12px; }
    .row-label { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .row-label strong { font-size: 12px; font-weight: 500; }
    .row-label small { color: var(--text-mute); font-size: 10px; }

    /* ---------- Botões ---------- */
    .btn {
      background: linear-gradient(180deg, var(--accent) 0%, var(--accent-2) 100%);
      color: #fff; border: 1px solid rgba(255,255,255,0.14);
      padding: 8px 16px;
      border-radius: 999px; cursor: pointer; font-size: 12px; font-weight: 500;
      font-family: inherit;
      white-space: nowrap;
      box-shadow: 0 6px 18px rgba(124,58,237,0.35), inset 0 1px 0 rgba(255,255,255,0.18);
      transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease), filter var(--dur) var(--ease);
    }
    .btn:hover { filter: brightness(1.08); box-shadow: 0 8px 24px rgba(124,58,237,0.5), inset 0 1px 0 rgba(255,255,255,0.22); }
    .btn:active { transform: scale(0.96); }
    .btn.ghost {
      background: var(--bg-elev); color: var(--text);
      border: 1px solid var(--stroke); box-shadow: none;
    }
    .btn.ghost:hover { background: var(--bg-elev-hover); }
    .btn.ok  { background: linear-gradient(180deg, #4ade80, #22c55e); box-shadow: 0 6px 18px rgba(34,197,94,0.35); }
    .btn.err { background: linear-gradient(180deg, #fb7185, #ef4444); box-shadow: 0 6px 18px rgba(239,68,68,0.35); }
    .btn.sm  { padding: 5px 12px; font-size: 10px; }

    /* ---------- Switch, select, range, input ---------- */
    .switch { position: relative; width: 42px; height: 24px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider-toggle {
      position: absolute; cursor: pointer; inset: 0;
      background: rgba(255,255,255,0.12); border: 1px solid var(--stroke);
      transition: background var(--dur) var(--ease); border-radius: 999px;
    }
    .slider-toggle::before {
      position: absolute; content: ""; height: 18px; width: 18px;
      left: 2px; top: 2px; background: #fff; transition: transform var(--dur) var(--ease); border-radius: 50%;
      box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    }
    input:checked + .slider-toggle {
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      border-color: transparent;
      box-shadow: 0 0 12px var(--glow);
    }
    input:checked + .slider-toggle::before { transform: translateX(18px); }

    select.dc-select, input.dc-input {
      background: var(--bg-elev); color: var(--text);
      border: 1px solid var(--stroke); border-radius: var(--r-sm);
      padding: 6px 10px; font-size: 12px; font-family: inherit; flex-shrink: 0; max-width: 60%;
      transition: border-color var(--dur) var(--ease), background var(--dur) var(--ease);
      appearance: none; -webkit-appearance: none; -moz-appearance: none;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path d='M1 1l4 4 4-4' stroke='%23a78bfa' stroke-width='1.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
      background-repeat: no-repeat; background-position: right 10px center; padding-right: 26px;
    }
    input.dc-input {
      background-image: none; padding-right: 10px;
    }
    select.dc-select:focus, input.dc-input:focus {
      outline: none; border-color: var(--accent); background: var(--bg-elev-2);
      box-shadow: 0 0 0 3px rgba(167,139,250,0.15);
    }
    select.dc-select option { background: var(--bg-deep); color: var(--text); }

    .range { -webkit-appearance: none; appearance: none;
      height: 6px; background: rgba(255,255,255,0.1);
      border: none; border-radius: 999px; width: 120px; outline: none;
    }
    .range::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      box-shadow: 0 0 12px var(--glow); cursor: pointer;
      border: 2px solid #fff;
    }
    .range::-moz-range-thumb {
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--accent); cursor: pointer; border: 2px solid #fff;
    }

    /* ---------- Assistente ---------- */
    .chat-log { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 2px; }
    .msg { max-width: 82%; padding: 10px 14px; border-radius: 16px; font-size: 12px; line-height: 1.4;
           animation: msgIn 320ms var(--ease); }
    @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; border-bottom-right-radius: 4px;
      box-shadow: 0 4px 14px rgba(124,58,237,0.35);
    }
    .msg.bot {
      align-self: flex-start; background: var(--bg-elev); border: 1px solid var(--stroke);
      border-bottom-left-radius: 4px;
    }
    .chat-input { display: flex; gap: 8px; margin-top: 8px; }
    .chat-input input {
      flex: 1; background: var(--bg-elev); border: 1px solid var(--stroke);
      color: var(--text); border-radius: 999px; padding: 10px 16px; font-size: 12px; min-width: 0;
      font-family: inherit;
    }
    .chat-input input:focus { outline: none; border-color: var(--accent); background: var(--bg-elev-2); }
    .quick-cmds { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0; }
    .quick-cmds .btn { font-size: 10px; padding: 5px 12px; }

    /* ---------- Tabs ---------- */
    .app-tabs { display: flex; gap: 6px; margin-bottom: 4px; }
    .app-tabs .tab-btn {
      background: var(--bg-elev); border: 1px solid var(--stroke); color: var(--text-dim);
      padding: 6px 14px; border-radius: 999px; cursor: pointer; font-size: 11px; font-family: inherit;
      transition: all var(--dur) var(--ease);
    }
    .app-tabs .tab-btn:hover { color: var(--text); }
    .app-tabs .tab-btn.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; border-color: transparent;
      box-shadow: 0 4px 14px rgba(124,58,237,0.4);
    }

    /* ---------- Monitorização ---------- */
    .sensor-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .sensor { text-align: center; padding: 14px 8px; }
    .sensor .val { font-size: clamp(18px, 5vw, 26px); font-weight: 700; letter-spacing: -0.02em; }
    .sensor .lbl { color: var(--text-mute); font-size: 10px; margin-top: 2px; }
    .bar-chart { display: flex; align-items: flex-end; gap: 5px; height: 70px; margin-top: 8px; }
    .bar-chart .bar {
      flex: 1;
      background: linear-gradient(180deg, var(--accent), var(--accent-2));
      border-radius: 4px 4px 0 0; opacity: .9;
      box-shadow: 0 0 8px rgba(139,92,246,0.35);
    }

    /* ---------- Alarmes ---------- */
    .alarm-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
    .alarm-item .prio { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 8px currentColor; }
    .prio.alta { background: var(--err); color: var(--err); }
    .prio.media { background: var(--warn); color: var(--warn); }
    .prio.baixa { background: var(--ok); color: var(--ok); }

    /* ---------- Chips ---------- */
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip {
      background: var(--bg-elev); border: 1px solid var(--stroke);
      padding: 5px 12px; border-radius: 999px; cursor: pointer;
      font-size: 10px; color: var(--text-dim); transition: all var(--dur) var(--ease);
    }
    .chip:hover { color: var(--text); }
    .chip.active {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; border-color: transparent;
      box-shadow: 0 4px 12px rgba(124,58,237,0.35);
    }

    .muted { color: var(--text-mute); }
    .store-item { display: flex; align-items: center; gap: 12px; }
    .store-item .app-icon { width: 44px; height: 44px; border-radius: 14px; font-size: 18px; flex-shrink: 0; }
    .store-meta { color: var(--text-mute); font-size: 10px; }

    /* ==============================================================
       MODAL (unificado) — confirmações, escolhas, alertas
    ============================================================== */
    .modal-backdrop {
      position: absolute; inset: 0; z-index: 60;
      background: rgba(3, 1, 8, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity var(--dur) var(--ease);
      padding: 20px;
    }
    .modal-backdrop.open { opacity: 1; pointer-events: auto; }
    .modal {
      width: min(360px, 100%);
      background: linear-gradient(180deg, rgba(20,14,36,0.98), rgba(10,7,22,0.98));
      border: 1px solid var(--stroke-strong);
      border-radius: var(--r-lg);
      padding: 20px;
      box-shadow: 0 30px 80px rgba(0,0,0,0.6), 0 0 40px rgba(124,58,237,0.25);
      transform: translateY(10px) scale(0.96); opacity: 0;
      transition: transform var(--dur) var(--ease), opacity var(--dur) var(--ease);
    }
    .modal-backdrop.open .modal { transform: none; opacity: 1; }
    .modal-icon {
      width: 48px; height: 48px; border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: #fff; margin-bottom: 12px;
      box-shadow: 0 8px 24px rgba(124,58,237,0.45);
    }
    .modal.err .modal-icon { background: linear-gradient(135deg, #fb7185, #ef4444); box-shadow: 0 8px 24px rgba(239,68,68,0.45); }
    .modal.warn .modal-icon { background: linear-gradient(135deg, #fbbf24, #f59e0b); box-shadow: 0 8px 24px rgba(245,158,11,0.45); }
    .modal.ok .modal-icon { background: linear-gradient(135deg, #4ade80, #22c55e); box-shadow: 0 8px 24px rgba(34,197,94,0.45); }
    .modal h3 { font-size: 15px; font-weight: 600; margin-bottom: 6px; letter-spacing: -0.01em; }
    .modal p { color: var(--text-dim); font-size: 12px; line-height: 1.5; margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; }

    /* ==============================================================
       TOASTS (notificações no estilo do sistema)
    ============================================================== */
    .toast-stack {
      position: absolute; top: 40px; left: 50%; transform: translateX(-50%);
      z-index: 55; display: flex; flex-direction: column; gap: 8px;
      width: min(340px, 88%); pointer-events: none;
    }
    .toast {
      background: rgba(20,14,36,0.9); backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border: 1px solid var(--stroke-strong);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex; align-items: center; gap: 10px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      transform: translateY(-8px); opacity: 0;
      transition: transform 300ms var(--ease), opacity 300ms var(--ease);
      pointer-events: auto;
    }
    .toast.show { transform: none; opacity: 1; }
    .toast .toast-ic {
      width: 28px; height: 28px; border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #fff; font-size: 12px; flex-shrink: 0;
    }
    .toast.ok .toast-ic  { background: linear-gradient(135deg, #4ade80, #22c55e); }
    .toast.warn .toast-ic{ background: linear-gradient(135deg, #fbbf24, #f59e0b); }
    .toast.err .toast-ic { background: linear-gradient(135deg, #fb7185, #ef4444); }
    .toast .toast-txt { display: flex; flex-direction: column; min-width: 0; }
    .toast .toast-txt strong { font-size: 12px; font-weight: 600; }
    .toast .toast-txt small { color: var(--text-mute); font-size: 10px; }

    /* ==============================================================
       SPLASH SCREEN
    ============================================================== */
    .splash {
      position: absolute; inset: 0; z-index: 100;
      background: radial-gradient(ellipse at center, #14092b 0%, #05030c 70%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 22px;
      transition: opacity 700ms var(--ease), visibility 700ms var(--ease);
    }
    .splash.hide { opacity: 0; visibility: hidden; }
    .splash .logo-wrap { position: relative; width: 96px; height: 96px; }
    .splash .logo-ring {
      position: absolute; inset: 0; border-radius: 50%;
      border: 2px solid transparent;
      border-top-color: var(--accent);
      border-right-color: var(--accent-cyan);
      animation: spin 1.4s linear infinite;
      filter: drop-shadow(0 0 12px var(--glow));
    }
    .splash .logo-ring.slow {
      inset: 10px;
      border-top-color: var(--accent-pink);
      border-right-color: transparent;
      animation-duration: 2.2s;
      animation-direction: reverse;
    }
    .splash .logo-core {
      position: absolute; inset: 20px; border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 24px; font-weight: 800; letter-spacing: -0.02em;
      box-shadow: 0 0 40px var(--glow), inset 0 2px 8px rgba(255,255,255,0.25);
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 30px var(--glow), inset 0 2px 8px rgba(255,255,255,0.25); }
      50%      { transform: scale(1.05); box-shadow: 0 0 50px var(--glow), inset 0 2px 8px rgba(255,255,255,0.35); }
    }
    .splash .title {
      font-size: 28px; font-weight: 300; letter-spacing: -0.02em;
      opacity: 0; animation: splashFade 900ms var(--ease) 300ms forwards;
    }
    .splash .title b {
      font-weight: 700;
      background: linear-gradient(120deg, var(--accent) 0%, var(--accent-cyan) 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .splash .tag {
      color: var(--text-mute); font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
      opacity: 0; animation: splashFade 900ms var(--ease) 600ms forwards;
    }
    @keyframes splashFade { to { opacity: 1; } }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <div class="device" id="device">
    <div class="noise"></div>

    <!-- ==================== SPLASH SCREEN ==================== -->
    <div class="splash" id="splash">
      <div class="logo-wrap">
        <div class="logo-ring"></div>
        <div class="logo-ring slow"></div>
        <div class="logo-core">DC</div>
      </div>
      <div class="title">DC <b>Assistente</b></div>
      <div class="tag">a inicializar</div>
    </div>

    <!-- ==================== BARRA DE ESTADO (FIXA) ==================== -->
    <div class="status-bar" id="status-bar">
      <div class="sb-left">
        <span class="dot"></span>
        <span id="sb-clock">--:--</span>
      </div>
      <div class="sb-right">
        <i class="fa-solid fa-plane" id="sb-airplane" title="Modo avião"></i>
        <i class="fa-solid fa-bluetooth-b" id="sb-bt" title="Bluetooth"></i>
        <i class="fa-solid fa-wifi" id="sb-wifi" title="Wi-Fi"></i>
        <i class="fa-solid fa-volume-high" id="sb-vol" title="Volume"></i>
        <div class="sb-battery"><i class="fa-solid fa-battery-three-quarters"></i><span id="sb-batt">78%</span></div>
      </div>
      <div class="sb-hint"></div>
    </div>

    <!-- ==================== PAINEL DE CONTROLO RÁPIDO ==================== -->
    <div class="quick-panel" id="quick-panel">
      <div class="qp-header">
        <div class="qp-title">
          <strong id="qp-title">Painel rápido</strong>
          <small id="qp-sub">Sábado, 24 de agosto</small>
        </div>
        <button class="qp-close" onclick="toggleQuickPanel(false)"><i class="fa-solid fa-xmark"></i></button>
      </div>
      <div class="qp-tiles" id="qp-tiles"></div>
      <div class="qp-slider">
        <i class="fa-solid fa-sun"></i>
        <input type="range" class="range" style="flex:1" id="qp-brightness" min="20" max="100" step="1">
        <span class="qp-val" id="qp-brightness-val">80%</span>
      </div>
      <div class="qp-slider">
        <i class="fa-solid fa-volume-high"></i>
        <input type="range" class="range" style="flex:1" id="qp-volume" min="0" max="100" step="1">
        <span class="qp-val" id="qp-volume-val">60%</span>
      </div>
      <div class="qp-drag"></div>
    </div>

    <!-- ==================== TOASTS ==================== -->
    <div class="toast-stack" id="toast-stack"></div>

    <!-- ==================== MODAL ==================== -->
    <div class="modal-backdrop" id="modal-backdrop">
      <div class="modal" id="modal">
        <div class="modal-icon" id="modal-icon"><i class="fa-solid fa-circle-info"></i></div>
        <h3 id="modal-title"></h3>
        <p id="modal-msg"></p>
        <div class="modal-actions" id="modal-actions"></div>
      </div>
    </div>

    <!-- ==================== ECRÃS ==================== -->
    <div class="screens">

      <!-- LAUNCHER -->
      <div class="screen active" id="screen-launcher">
        <div class="launcher-head">
          <div>
            <h1 data-i18n="os.title">DC <span>Sistema</span></h1>
            <p data-i18n="os.subtitle">Escolhe uma aplicação</p>
          </div>
          <div class="launcher-date">
            <b id="lh-time">--:--</b>
            <small id="lh-date">--</small>
          </div>
        </div>
        <div class="launcher-grid" id="launcher-grid"></div>
      </div>

      <!-- AMBIENTE DE APP -->
      <div class="screen" id="screen-app">
        <div class="app-header">
          <button class="back-btn" onclick="goHome()"><i class="fa-solid fa-chevron-left"></i></button>
          <div class="app-icon-mini" id="app-header-icon"></div>
          <h2 id="app-header-title"></h2>
        </div>
        <div class="app-body" id="app-body"></div>
      </div>

    </div>
  </div>

  <script>
    /* ================================================================
       APP REGISTRY
    ================================================================ */
    const APPS = [
      { id: 'assistant',    name: 'DC Assistant',   icon: 'fa-solid fa-robot',           color: '#a78bfa', desc: 'Assistente inteligente' },
      { id: 'controlo',     name: 'Controlo',       icon: 'fa-solid fa-sliders',         color: '#22d3ee', desc: 'Comandos do sistema' },
      { id: 'monitorizacao',name: 'Monitorização',  icon: 'fa-solid fa-chart-line',      color: '#60a5fa', desc: 'Tempo real e histórico' },
      { id: 'alarmes',      name: 'Alarmes',        icon: 'fa-solid fa-bell',            color: '#f87171', desc: 'Central de alarmes' },
      { id: 'agenda',       name: 'Agenda',         icon: 'fa-regular fa-calendar-days', color: '#fbbf24', desc: 'Tarefas e eventos' },
      { id: 'musica',       name: 'Música',         icon: 'fa-brands fa-spotify',        color: '#1DB954', desc: 'Multimédia' },
      { id: 'loja',         name: 'Loja',           icon: 'fa-solid fa-store',           color: '#f472b6', desc: 'App Store' },
      { id: 'definicoes',   name: 'Definições',     icon: 'fa-solid fa-gear',            color: '#94a3b8', desc: 'Sistema' },
    ];
    const appById = id => APPS.find(a => a.id === id);

    /* ================================================================
       ESTADO
    ================================================================ */
    const SYS_KEY = 'dc_system_settings';
    const ASST_KEY = 'dc_assistant_settings';

    const defaultSystem = {
      deviceName: 'DC', language: 'pt', theme: 'dark',
      brightness: 80, volume: 60,
      wifiOn: true, bluetoothOn: false, airplaneOn: false,
      dndOn: false, flashOn: false, rotationOn: true,
      lockOn: false, showStats: true,
    };
    const defaultAssistant = {
      name: 'DC', language: 'pt', voice: 'feminina', personality: 'amigável',
      notifications: 'alto', allowCommands: true, integrations: ['spotify','agenda'],
      model: 'mock', privacy: true,
    };

    const system = { ...defaultSystem, ...(JSON.parse(localStorage.getItem(SYS_KEY) || '{}')) };
    const assistant = { ...defaultAssistant, ...(JSON.parse(localStorage.getItem(ASST_KEY) || '{}')) };
    const saveSystem  = () => localStorage.setItem(SYS_KEY, JSON.stringify(system));
    const saveAssistant = () => localStorage.setItem(ASST_KEY, JSON.stringify(assistant));

    /* ================================================================
       i18n
    ================================================================ */
    const translations = {
      pt: {
        'os.title':'DC <span>Sistema</span>', 'os.subtitle':'Escolhe uma aplicação',
        'app.assistant':'DC Assistant', 'app.controlo':'Controlo', 'app.monitorizacao':'Monitorização',
        'app.alarmes':'Alarmes', 'app.agenda':'Agenda', 'app.musica':'Música',
        'app.loja':'Loja', 'app.definicoes':'Definições',
      },
      en: {
        'os.title':'DC <span>System</span>', 'os.subtitle':'Pick an app',
        'app.assistant':'DC Assistant','app.controlo':'Control','app.monitorizacao':'Monitoring',
        'app.alarmes':'Alarms','app.agenda':'Calendar','app.musica':'Music',
        'app.loja':'Store','app.definicoes':'Settings',
      },
    };
    const t = k => (translations[system.language] || translations.pt)[k] || k;
    function applyI18n() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const k = el.getAttribute('data-i18n');
        if (k === 'os.title') el.innerHTML = t(k); else el.textContent = t(k);
      });
      renderLauncher();
    }

    /* ================================================================
       MODAL — API unificada
       showModal({type, title, message, actions:[{label, style, onClick}]})
    ================================================================ */
    function showModal({ type='info', title='', message='', actions=[{label:'OK', style:'', onClick:closeModal}] }) {
      const bd = document.getElementById('modal-backdrop');
      const m  = document.getElementById('modal');
      const ic = document.getElementById('modal-icon');
      m.className = 'modal ' + (type === 'error' ? 'err' : type === 'warn' ? 'warn' : type === 'ok' ? 'ok' : '');
      const iconMap = { info:'fa-circle-info', ok:'fa-circle-check', warn:'fa-triangle-exclamation', error:'fa-circle-exclamation' };
      ic.innerHTML = `<i class="fa-solid ${iconMap[type] || iconMap.info}"></i>`;
      document.getElementById('modal-title').textContent = title;
      document.getElementById('modal-msg').textContent = message;
      const actionsEl = document.getElementById('modal-actions');
      actionsEl.innerHTML = '';
      actions.forEach(a => {
        const b = document.createElement('button');
        b.className = 'btn ' + (a.style || '');
        b.textContent = a.label;
        b.onclick = () => { closeModal(); a.onClick && a.onClick(); };
        actionsEl.appendChild(b);
      });
      bd.classList.add('open');
    }
    function closeModal() { document.getElementById('modal-backdrop').classList.remove('open'); }
    document.getElementById('modal-backdrop').addEventListener('click', e => {
      if (e.target.id === 'modal-backdrop') closeModal();
    });

    /* ================================================================
       TOAST — API unificada
       toast({type, title, message, duration})
    ================================================================ */
    function toast({ type='info', title='', message='', duration=3200 }) {
      const stack = document.getElementById('toast-stack');
      const el = document.createElement('div');
      const iconMap = { info:'fa-circle-info', ok:'fa-check', warn:'fa-triangle-exclamation', error:'fa-xmark' };
      el.className = 'toast ' + (type === 'error' ? 'err' : type === 'ok' ? 'ok' : type === 'warn' ? 'warn' : '');
      el.innerHTML = `
        <div class="toast-ic"><i class="fa-solid ${iconMap[type] || iconMap.info}"></i></div>
        <div class="toast-txt">
          <strong>${title}</strong>
          ${message ? `<small>${message}</small>` : ''}
        </div>`;
      stack.appendChild(el);
      requestAnimationFrame(() => el.classList.add('show'));
      setTimeout(() => {
        el.classList.remove('show');
        setTimeout(() => el.remove(), 320);
      }, duration);
    }

    /* ================================================================
       NAVEGAÇÃO
    ================================================================ */
    let currentApp = null;
    function openApp(id) {
      currentApp = id;
      const app = appById(id);
      document.getElementById('screen-launcher').classList.remove('active');
      document.getElementById('screen-app').classList.add('active');
      document.getElementById('app-header-title').textContent = app.name;
      document.getElementById('app-header-icon').innerHTML = `<i class="${app.icon}" style="color:${app.color}"></i>`;
      renderApp(id);
    }
    function goHome() {
      currentApp = null;
      document.getElementById('screen-app').classList.remove('active');
      document.getElementById('screen-launcher').classList.add('active');
    }

    /* ================================================================
       LAUNCHER
    ================================================================ */
    function renderLauncher() {
      const grid = document.getElementById('launcher-grid');
      grid.innerHTML = '';
      APPS.forEach((app, i) => {
        const item = document.createElement('div');
        item.className = 'app-item';
        item.style.animationDelay = (i * 40) + 'ms';
        item.innerHTML = `
          <div class="app-icon" style="color:${app.color}"><i class="${app.icon}"></i></div>
          <span>${t('app.' + app.id)}</span>
          <small>${app.desc}</small>`;
        item.onclick = () => openApp(app.id);
        grid.appendChild(item);
      });
    }

    /* ================================================================
       PAINEL RÁPIDO
    ================================================================ */
    const QUICK_TILES = [
      { id: 'wifiOn',     label: 'Wi-Fi',       icon: 'fa-solid fa-wifi',            sub: () => system.wifiOn ? 'Ligado' : 'Desligado' },
      { id: 'bluetoothOn',label: 'Bluetooth',   icon: 'fa-solid fa-bluetooth-b',     sub: () => system.bluetoothOn ? 'Ligado' : 'Desligado' },
      { id: 'airplaneOn', label: 'Modo avião',  icon: 'fa-solid fa-plane',           sub: () => system.airplaneOn ? 'Ativo' : 'Inativo' },
      { id: 'dndOn',      label: 'Não perturbe',icon: 'fa-solid fa-moon',            sub: () => system.dndOn ? 'Ativo' : 'Inativo' },
      { id: 'flashOn',    label: 'Lanterna',    icon: 'fa-solid fa-flashlight',      sub: () => system.flashOn ? 'Ligada' : 'Desligada' },
      { id: 'rotationOn', label: 'Rotação',     icon: 'fa-solid fa-arrows-rotate',   sub: () => system.rotationOn ? 'Auto' : 'Bloqueada' },
    ];
    function renderQuickTiles() {
      const wrap = document.getElementById('qp-tiles');
      wrap.innerHTML = '';
      QUICK_TILES.forEach(tile => {
        const on = !!system[tile.id];
        const el = document.createElement('div');
        el.className = 'qp-tile' + (on ? ' on' : '');
        el.innerHTML = `
          <div class="qp-ic"><i class="${tile.icon}"></i></div>
          <div class="qp-txt"><strong>${tile.label}</strong><small>${tile.sub()}</small></div>`;
        el.onclick = () => {
          // Modo avião desliga rádios
          if (tile.id === 'airplaneOn' && !system.airplaneOn) {
            system.airplaneOn = true; system.wifiOn = false; system.bluetoothOn = false;
          } else if (tile.id === 'airplaneOn' && system.airplaneOn) {
            system.airplaneOn = false;
          } else {
            if (system.airplaneOn && (tile.id === 'wifiOn' || tile.id === 'bluetoothOn')) {
              toast({ type:'warn', title:'Modo avião ativo', message:'Desliga o modo avião primeiro.' });
              return;
            }
            system[tile.id] = !system[tile.id];
          }
          saveSystem(); renderQuickTiles(); updateStatusIcons();
          toast({ type:'ok', title: tile.label, message: tile.sub() });
        };
        wrap.appendChild(el);
      });
    }

    function toggleQuickPanel(force) {
      const p = document.getElementById('quick-panel');
      const willOpen = force !== undefined ? force : !p.classList.contains('open');
      p.classList.toggle('open', willOpen);
      if (willOpen) renderQuickTiles();
    }

    // Gesto — arrastar para baixo desde a barra de estado
    (function setupSwipe() {
      const sb = document.getElementById('status-bar');
      const panel = document.getElementById('quick-panel');
      let startY = null, dragging = false;

      const onStart = (y) => { startY = y; dragging = true; };
      const onMove = (y) => {
        if (!dragging || startY === null) return;
        const dy = y - startY;
        if (dy > 30) { toggleQuickPanel(true); dragging = false; }
      };
      const onEnd = () => { dragging = false; startY = null; };

      sb.addEventListener('mousedown', e => onStart(e.clientY));
      window.addEventListener('mousemove', e => onMove(e.clientY));
      window.addEventListener('mouseup', onEnd);
      sb.addEventListener('touchstart', e => onStart(e.touches[0].clientY), { passive: true });
      window.addEventListener('touchmove', e => onMove(e.touches[0].clientY), { passive: true });
      window.addEventListener('touchend', onEnd);

      // Clicar simples na barra também abre
      sb.addEventListener('click', (e) => {
        if (e.target.closest('.sb-hint') || e.target === sb || e.target.closest('.sb-left') || e.target.closest('.sb-right')) {
          toggleQuickPanel();
        }
      });

      // Arrastar o painel para cima para fechar
      let pStartY = null;
      panel.addEventListener('mousedown', e => { pStartY = e.clientY; });
      window.addEventListener('mouseup', e => {
        if (pStartY !== null && (pStartY - e.clientY) > 40) toggleQuickPanel(false);
        pStartY = null;
      });
      panel.addEventListener('touchstart', e => { pStartY = e.touches[0].clientY; }, { passive: true });
      window.addEventListener('touchend', e => {
        if (pStartY !== null && e.changedTouches[0] && (pStartY - e.changedTouches[0].clientY) > 40) toggleQuickPanel(false);
        pStartY = null;
      });
    })();

    // Sliders do painel rápido
    document.getElementById('qp-brightness').addEventListener('input', e => {
      system.brightness = +e.target.value; saveSystem();
      document.getElementById('qp-brightness-val').textContent = system.brightness + '%';
      document.getElementById('device').style.filter = `brightness(${20 + system.brightness*0.8}%)`;
    });
    document.getElementById('qp-volume').addEventListener('input', e => {
      system.volume = +e.target.value; saveSystem();
      document.getElementById('qp-volume-val').textContent = system.volume + '%';
      updateStatusIcons();
    });

    /* ================================================================
       BARRA DE ESTADO — atualizar ícones conforme estado
    ================================================================ */
    function updateStatusIcons() {
      document.getElementById('sb-wifi').classList.toggle('on', system.wifiOn && !system.airplaneOn);
      document.getElementById('sb-bt').classList.toggle('on', system.bluetoothOn && !system.airplaneOn);
      document.getElementById('sb-airplane').classList.toggle('on', system.airplaneOn);
      document.getElementById('sb-airplane').style.display = system.airplaneOn ? '' : 'none';
      const vol = document.getElementById('sb-vol');
      vol.className = system.volume === 0 ? 'fa-solid fa-volume-xmark on'
                     : system.volume < 40 ? 'fa-solid fa-volume-low on'
                     : 'fa-solid fa-volume-high on';
    }

    /* ================================================================
       RELÓGIO
    ================================================================ */
    function clockLoop() {
      const d = new Date();
      const hh = String(d.getHours()).padStart(2,'0');
      const mm = String(d.getMinutes()).padStart(2,'0');
      document.getElementById('sb-clock').textContent = `${hh}:${mm}`;
      document.getElementById('lh-time').textContent = `${hh}:${mm}`;
      document.getElementById('lh-date').textContent =
        d.toLocaleDateString(system.language==='en'?'en-GB':'pt-PT', { weekday:'long', day:'numeric', month:'long' });
      document.getElementById('qp-sub').textContent =
        d.toLocaleDateString(system.language==='en'?'en-GB':'pt-PT', { weekday:'long', day:'numeric', month:'long' });
      setTimeout(clockLoop, 1000);
    }

      body.innerHTML = '';
      (renderers[id] || (() => { body.innerHTML = '<div class="card muted">Em breve.</div>'; }))();

    function assistantSend() {
      const input = document.getElementById('chat-text');
      const text = input.value.trim(); if (!text) return;
      const log = document.getElementById('chat-log');
      log.innerHTML += `<div class="msg user">${text}</div>`;
      input.value = ''; chatHistory.unshift(text);
      setTimeout(() => {
        const replies = {
          'estado do sistema':'Tudo operacional. Rede ligada, temperatura 23.4 °C, 1 alarme ativo.',
          'análise de alarmes':'1 alarme ativo (prioridade alta): temperatura elevada no controlo.',

          'sugestões':'Sugiro baixar o setpoint do controlo em 1 °C e verificar a ventilação.',
        };
        const reply = replies[text.toLowerCase()] || `Recebido: "${text}". (Resposta simulada — liga ao Gateway na fase 0.5.)`;
        log.innerHTML += `<div class="msg bot">${reply}</div>`;
        log.scrollTop = log.scrollHeight;
      }, 300);
      log.scrollTop = log.scrollHeight;
    }

          <div class="row" style="gap:8px">
            <button class="btn ghost sm" onclick="showModal({type:'warn',title:'Reiniciar sistema?',message:'O ecrã ficará indisponível por alguns segundos.',actions:[{label:'Cancelar',style:'ghost'},{label:'Reiniciar',style:'',onClick:()=>{document.getElementById('splash').classList.remove('hide');setTimeout(()=>document.getElementById('splash').classList.add('hide'),1800);}}]})">Reiniciar sistema</button>
            <button class="btn err sm" onclick="showModal({type:'error',title:'Desligar sistema?',message:'Vais desligar completamente a assistente DC.',actions:[{label:'Cancelar',style:'ghost'},{label:'Desligar',style:'err',onClick:()=>toast({type:'warn',title:'Sistema em suspensão'})}]})">Desligar sistema</button>
          </div>
          <div class="row"><span class="muted">Informações do dispositivo</span><span>ESP32-S3 · DC 0.4</span></div>`,
        'Interface': `
          <div class="row"><div class="row-label"><strong>Tema</strong></div>
            <select class="dc-select" onchange="system.theme=this.value;saveSystem();toast({type:'ok',title:'Tema alterado'})">
              <option value="dark" ${system.theme==='dark'?'selected':''}>Escuro</option>
              <option value="light" ${system.theme==='light'?'selected':''}>Claro</option></select></div>
          <div class="row"><div class="row-label"><strong>Brilho</strong><small>${system.brightness}%</small></div>
            <input type="range" class="range" min="20" max="100" value="${system.brightness}" oninput="system.brightness=+this.value;saveSystem();this.previousElementSibling.querySelector('small').textContent=this.value+'%';document.getElementById('device').style.filter='brightness('+(20+this.value*0.8)+'%)';document.getElementById('qp-brightness').value=this.value;document.getElementById('qp-brightness-val').textContent=this.value+'%'"></div>
          <div class="row"><div class="row-label"><strong>Volume</strong><small>${system.volume}%</small></div>
            <input type="range" class="range" min="0" max="100" value="${system.volume}" oninput="system.volume=+this.value;saveSystem();this.previousElementSibling.querySelector('small').textContent=this.value+'%';document.getElementById('qp-volume').value=this.value;document.getElementById('qp-volume-val').textContent=this.value+'%';updateStatusIcons()"></div>
          <div class="row"><div class="row-label"><strong>Papel de parede</strong></div><button class="btn ghost sm" onclick="toast({type:'info',title:'Em breve'})">Escolher</button></div>
          <div class="row"><div class="row-label"><strong>Tamanho dos textos</strong></div>
            <select class="dc-select"><option>Normal</option><option>Grande</option></select></div>
          <div class="row"><div class="row-label"><strong>Mostrar CPU / FPS</strong></div>
            <label class="switch"><input type="checkbox" ${system.showStats?'checked':''} onchange="system.showStats=this.checked;saveSystem()"><span class="slider-toggle"></span></label></div>`,
        'Rede': `
          <div class="row"><div class="row-label"><strong>Wi-Fi</strong></div>
            <label class="switch"><input type="checkbox" ${system.wifiOn?'checked':''} onchange="system.wifiOn=this.checked;saveSystem();updateStatusIcons();toast({type:'ok',title:'Wi-Fi',message:this.checked?'Ligado':'Desligado'})"><span class="slider-toggle"></span></label></div>
          <div class="row"><div class="row-label"><strong>Bluetooth</strong></div>
            <label class="switch"><input type="checkbox" ${system.bluetoothOn?'checked':''} onchange="system.bluetoothOn=this.checked;saveSystem();updateStatusIcons();toast({type:'ok',title:'Bluetooth',message:this.checked?'Ligado':'Desligado'})"><span class="slider-toggle"></span></label></div>
          <div class="row"><div class="row-label"><strong>Modo avião</strong></div>
            <label class="switch"><input type="checkbox" ${system.airplaneOn?'checked':''} onchange="system.airplaneOn=this.checked;if(this.checked){system.wifiOn=false;system.bluetoothOn=false;}saveSystem();updateStatusIcons();renderSetCat()"><span class="slider-toggle"></span></label></div>
          <div class="row"><div class="row-label"><strong>Ethernet</strong></div><span class="muted">Não ligado</span></div>
          <div class="row"><div class="row-label"><strong>Estado da ligação</strong></div><b style="color:${system.wifiOn?'var(--ok)':'var(--err)'}">${system.wifiOn?'Ligada':'Desligada'}</b></div>
          <div class="row"><div class="row-label"><strong>Configuração IP</strong></div><span class="muted">DHCP</span></div>`,
        'Segurança': `
          <div class="row"><div class="row-label"><strong>Bloqueio do sistema</strong></div>
            <label class="switch"><input type="checkbox" ${system.lockOn?'checked':''} onchange="system.lockOn=this.checked;saveSystem()"><span class="slider-toggle"></span></label></div>
          <div class="row"><div class="row-label"><strong>PIN / palavra-passe</strong></div><button class="btn ghost sm" onclick="toast({type:'info',title:'Em breve'})">Definir</button></div>
          <div class="row"><div class="row-label"><strong>Utilizadores</strong></div><span class="muted">1</span></div>
          <div class="row"><div class="row-label"><strong>Sessões ativas</strong></div><span class="muted">1</span></div>`,
        'Hardware': `
          <div class="row"><div class="row-label"><strong>Estado do ESP32</strong></div><b style="color:var(--ok)">OK</b></div>
          <div class="row"><div class="row-label"><strong>Sensores</strong></div><span class="muted">2 ativos</span></div>
          <div class="row"><div class="row-label"><strong>Entradas e saídas</strong></div><span class="muted">4 livres</span></div>
          <div class="row"><div class="row-label"><strong>Relés</strong></div><span class="muted">0 ativos</span></div>
          <div class="row"><div class="row-label"><strong>Dispositivos conectados</strong></div><span class="muted">1</span></div>
          <div class="row"><button class="btn ghost sm" onclick="toast({type:'info',title:'Diagnóstico iniciado'})">Diagnóstico</button></div>`,
        'Aplicações': `
          <div class="row"><div class="row-label"><strong>Aplicações instaladas</strong></div><b>${APPS.length + storeInstalled.size}</b></div>
          <div class="row"><div class="row-label"><strong>Permissões das aplicações</strong></div><button class="btn ghost sm" onclick="toast({type:'info',title:'Em breve'})">Gerir</button></div>
          <div class="row"><div class="row-label"><strong>Notificações</strong></div><button class="btn ghost sm" onclick="toast({type:'info',title:'Em breve'})">Gerir</button></div>
          <div class="row"><div class="row-label"><strong>Armazenamento</strong></div><span class="muted">1.2 GB livres</span></div>
          <div class="row"><div class="row-label"><strong>Atualizações</strong></div><button class="btn ghost sm" onclick="toast({type:'ok',title:'Sistema atualizado'})">Verificar</button></div>`,
      };
      panel.innerHTML = `<div class="card" style="margin-top:8px">${rows[setCat] || ''}</div>`;
    }

    /* ================================================================
       INIT
    ================================================================ */
    function boot() {
      renderLauncher();
      applyI18n();
      updateStatusIcons();
      document.getElementById('qp-brightness').value = system.brightness;
      document.getElementById('qp-brightness-val').textContent = system.brightness + '%';
      document.getElementById('qp-volume').value = system.volume;
      document.getElementById('qp-volume-val').textContent = system.volume + '%';
      document.getElementById('device').style.filter = `brightness(${20 + system.brightness*0.8}%)`;
      clockLoop();

      // Splash — esconder após ~2.4s
      setTimeout(() => {
        document.getElementById('splash').classList.add('hide');
        setTimeout(() => {
          toast({ type:'ok', title:'Bem-vinda', message:`Olá, sou a ${assistant.name}` });
        }, 500);
      }, 2400);
    }
    boot();
  </script>
</body>
</html>
