    /* ================================================================
       PIN LOCK (Bloqueio de arranque)
    ================================================================ */
    let pinBuffer = '';
    let pinMode = 'unlock'; // 'unlock' | 'setup' | 'setup-confirm'
    let pinSetupFirst = '';
    let pinOnUnlock = null;

    function updateLockDots() {
      const dots = document.querySelectorAll('#lock-dots .lock-dot');
      dots.forEach((d, i) => d.classList.toggle('filled', i < pinBuffer.length));
    }

    function showLockScreen(mode = 'unlock', opts = {}) {
      pinMode = mode; pinBuffer = ''; pinSetupFirst = '';
      pinOnUnlock = opts.onUnlock || null;
      const scr = document.getElementById('lock-screen');
      const title = document.getElementById('lock-title');
      const hint  = document.getElementById('lock-hint');
      const cancel = document.getElementById('pin-cancel');
      if (mode === 'setup') {
        title.textContent = 'Definir novo PIN';
        hint.textContent = '4 dígitos';
        cancel.style.visibility = 'visible';
      } else if (mode === 'setup-confirm') {
        title.textContent = 'Confirma o PIN';
        hint.textContent = 'Repete os 4 dígitos';
        cancel.style.visibility = 'visible';
      } else {
        title.textContent = 'Introduz o PIN';
        hint.textContent = opts.hint || 'Ecrã bloqueado';
        cancel.style.visibility = opts.allowCancel ? 'visible' : 'hidden';
      }
      updateLockDots();
      scr.classList.add('open');
    }
    function hideLockScreen() { document.getElementById('lock-screen').classList.remove('open'); }

    function pinPress(k) {
      if (k === 'cancel') { pinBuffer=''; pinSetupFirst=''; updateLockDots(); hideLockScreen(); return; }
      if (k === 'back')   { pinBuffer = pinBuffer.slice(0, -1); updateLockDots(); return; }
      if (pinBuffer.length >= 4) return;
      pinBuffer += String(k); updateLockDots();
      if (pinBuffer.length === 4) setTimeout(handlePinComplete, 150);
    }

    function shakeLock() {
      const scr = document.getElementById('lock-screen');
      scr.classList.add('shake');
      setTimeout(() => scr.classList.remove('shake'), 450);
    }

    function handlePinComplete() {
      if (pinMode === 'setup') {
        pinSetupFirst = pinBuffer; pinBuffer = '';
        if (pendingUserPin) {
          document.getElementById('lock-title').textContent = 'Confirma o PIN';
        }
        showLockScreen('setup-confirm');
        if (pendingUserPin) {
          document.getElementById('lock-title').textContent = `Confirma o PIN de ${userById(pendingUserPin).name}`;
        }
        return;
      }
      if (pinMode === 'setup-confirm') {
        if (pinBuffer === pinSetupFirst) {
          if (pendingUserPin) {
            const u = userById(pendingUserPin);
            if (u) { u.pin = pinBuffer; saveUsers(); }
            pendingUserPin = null;
            hideLockScreen();
            toast({ type:'ok', title:'PIN definido', message: u ? u.name : '' });
            if (currentApp === 'definicoes') renderSetCat();
            return;
          }
          system.pin = pinBuffer; system.lockOn = true;
          saveSystem(); hideLockScreen();
          toast({ type:'ok', title:'PIN definido', message:'Bloqueio ativo no arranque' });
          if (currentApp === 'definicoes') renderSetCat();
        } else {
          shakeLock(); pinBuffer=''; updateLockDots();
          toast({ type:'error', title:'PINs não coincidem', message:'Tenta de novo' });
          pinSetupFirst = ''; setTimeout(() => showLockScreen('setup'), 300);
        }
        return;
      }
      // unlock — verifica PIN do sistema ou do utilizador ativo
      const au = activeUser();
      const sysPinMatch = system.pin && pinBuffer === system.pin;
      const userPinMatch = au.pin && pinBuffer === au.pin;
      if (sysPinMatch || userPinMatch) {
        pinBuffer=''; updateLockDots(); hideLockScreen();
        if (pinOnUnlock) { const cb = pinOnUnlock; pinOnUnlock = null; cb(); }
      } else {
        shakeLock(); pinBuffer=''; updateLockDots();
      }
    }

    function openPinSetup() {
      // Se ja existe PIN, exigir o atual antes de alterar
      if (system.pin) {
        showLockScreen('unlock', { hint:'Introduz o PIN atual', allowCancel: true, onUnlock: () => showLockScreen('setup') });
      } else {
        showLockScreen('setup');
      }
    }

    function removePin() {

    /* ================================================================
       WAKE WORD — "Olá DC" (Web Speech API)
    ================================================================ */
    let wakeRecognition = null;
    let wakeListening = false;

    function startWakeWord() {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SR) {
        toast({ type: 'error', title: 'Voz não suportada', message: 'Este navegador não suporta reconhecimento de voz' });
        system.wakeWordOn = false; saveSystem();
        return;
      }
      if (wakeListening) return;
      wakeRecognition = new SR();
      wakeRecognition.lang = 'pt-PT';
      wakeRecognition.continuous = true;
      wakeRecognition.interimResults = false;
      wakeRecognition.onresult = (e) => {
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const transcript = e.results[i][0].transcript.toLowerCase().trim();
          if (transcript.includes('olá dc') || transcript.includes('ola dc') || transcript.includes('ola d c')) {
            if (currentApp !== 'assistant') {
              openApp('assistant');
              toast({ type: 'ok', title: 'Olá! DC acordou', message: 'Assistente ativada por voz' });
            }
          }
        }
      };
      wakeRecognition.onerror = (e) => {
        if (e.error === 'not-allowed' || e.error === 'service-not-allowed') {
          toast({ type: 'error', title: 'Sem acesso ao microfone', message: 'Permite o microfone para usar a palavra de ativação' });
          system.wakeWordOn = false; saveSystem();
          wakeListening = false;
        }
      };
      wakeRecognition.onend = () => {
        wakeListening = false;
        if (system.wakeWordOn) {
          try { wakeRecognition.start(); wakeListening = true; } catch (_) {}
        }
      };
      try { wakeRecognition.start(); wakeListening = true; } catch (_) {}
    }

    function stopWakeWord() {
      if (wakeRecognition) { try { wakeRecognition.stop(); } catch (_) {} }
      wakeListening = false;
    }

    function toggleWakeWord(on) {
      system.wakeWordOn = on; saveSystem();
      if (on) startWakeWord(); else stopWakeWord();
      if (currentApp === 'definicoes') renderSetCat();
    }

    /* ================================================================
       INIT
    ================================================================ */
    function boot() {
      renderLauncher();
      applyI18n();
      updateStatusIcons();
      initCustomSelects();
      applyWallpaper();
      document.getElementById('qp-brightness').value = system.brightness;
      document.getElementById('qp-brightness-val').textContent = system.brightness + '%';
      document.getElementById('qp-volume').value = system.volume;
      document.getElementById('qp-volume-val').textContent = system.volume + '%';
      document.getElementById('device').style.filter = `brightness(${20 + system.brightness*0.8}%)`;
      clockLoop();

      // Iniciar wake word se ativo
      if (system.wakeWordOn) setTimeout(() => startWakeWord(), 2800);

      // Splash — esconder após ~2.4s
      setTimeout(() => {
        document.getElementById('splash').classList.add('hide');
        // Mostrar lock screen se PIN estiver ativo
        if (system.lockOn && system.pin) {
          showLockScreen('unlock', { hint:'Introduz o PIN para desbloquear' });
        }
      }, 2400);
    }
    boot();
  </script>
</body>
</html>
