# DC — Docker Compose
#
# Dois serviços:
#   - dc-gateway: o backend real (Node/TypeScript) — o "cérebro" da DC.
#   - frontend-preview: SÓ serve o mockup HTML/CSS/JS (Echo Mind UI) para
#     pré-visualizar o conceito visual no browser do PC. NÃO é a interface
#     real do dispositivo — essa é LVGL e só corre no ESP32-S3 físico
#     (ver firmware/README.md). Isto é apenas uma prévia estática.
#
# Uso:
#   cp dc-gateway/.env.example dc-gateway/.env   # preencher com valores reais
#   docker compose up -d --build
#
# dc-gateway fica em http://localhost:4000 (ver PORT no .env)
# frontend-preview fica em http://localhost:8080

services:
  dc-gateway:
    build:
      context: ./dc-gateway
      dockerfile: Dockerfile
    container_name: dc-gateway
    restart: unless-stopped
    env_file:
      - ./dc-gateway/.env
    ports:
      - "${GATEWAY_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend-preview:
    build:
      context: ./frontend-preview
      dockerfile: Dockerfile
    container_name: dc-frontend-preview
    restart: unless-stopped
    ports:
      - "${FRONTEND_PREVIEW_PORT:-8080}:80"
